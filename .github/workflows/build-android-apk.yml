name: Build ZakiChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'pages/**'
      - 'static/**'
      - 'index.html'
      - 'manifest.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZakiChat
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare bundled ZakiChat web app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='supabase/' \
            --exclude='node_modules/' \
            ./ android/app/src/main/assets/

      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug and release APKs
        run: |
          /tmp/gradle-8.9/bin/gradle --no-daemon -p android assembleDebug assembleRelease

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZakiChat-Android-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
