            fi
          done
          echo "Admin-content deployment failed after 3 attempts." >&2
          exit 1

      - name: Deploy admin-upgrades (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Admin-upgrades deploy attempt $attempt of 3"
