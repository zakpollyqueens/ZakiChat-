            fi
          done
          echo "Delete-account deployment failed after 3 attempts." >&2
          exit 1

      - name: Deploy security-auth (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
