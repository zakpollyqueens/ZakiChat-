name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping deployments of the same Supabase function.
concurrency:
  group: zakichat-supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xdpevlurgtvgduwzyoue

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.58.5

      - name: Deploy two-step (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3"
            if supabase functions deploy two-step --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Supabase deployment failed after 3 attempts." >&2
          exit 1

      - name: Deploy registration-payment (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Registration-payment deploy attempt $attempt of 3"
            if supabase functions deploy registration-payment --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Registration-payment deployment failed after 3 attempts." >&2
          exit 1

      - name: Deploy delete-account (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Delete-account deploy attempt $attempt of 3"
            if supabase functions deploy delete-account --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
            fi
