      - name: Deploy web-search (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Web-search deploy attempt $attempt of 3"
            if supabase functions deploy web-search --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
