            if supabase functions deploy mobile-app-handoff --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "Mobile app handoff deployment failed after 3 attempts." >&2
          exit 1

      - name: Deploy notifications webhook (requires NOTIFICATIONS_WEBHOOK_SECRET)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if supabase functions deploy notifications --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "Notifications deployment failed after 3 attempts." >&2
          exit 1

      - name: Notify Slack about Supabase deployment (optional)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; Slack notification skipped."
            exit 0
          fi
          export DEPLOY_STATUS RUN_URL
          payload=$(python3 - <<'PY'
          import json, os
          status = os.environ.get("DEPLOY_STATUS", "unknown").upper()
          emoji = ":white_check_mark:" if status == "SUCCESS" else ":x:"
          print(json.dumps({"text": f"{emoji} Zamivox Supabase deployment — {status}\\nWorkflow: {os.environ.get('RUN_URL')}"}))
          PY
          )
          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"
