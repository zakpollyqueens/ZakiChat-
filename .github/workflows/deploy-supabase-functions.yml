            fi
          done
          echo "Release-management deployment failed after 3 attempts." >&2
          exit 1

      - name: Deploy admin-content (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Admin-content deploy attempt $attempt of 3"
            if supabase functions deploy admin-content --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
