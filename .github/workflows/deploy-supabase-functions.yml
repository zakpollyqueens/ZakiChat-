          exit 1

      - name: Deploy upgrade-checkout (retry transient deployment conflicts)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Upgrade-checkout deploy attempt $attempt of 3"
            if supabase functions deploy upgrade-checkout --use-api --project-ref "$SUPABASE_PROJECT_ID"; then
