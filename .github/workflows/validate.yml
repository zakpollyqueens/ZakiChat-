name: ZakiChat Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find static/js -type f -name '*.js' ! -name '*.bak*' -print0)

      - name: Check local HTML asset references
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys

          root = Path('.').resolve()
          missing = []

          class RefParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('src', 'href'):
                      value = attrs.get(key, '')
                      if value:
                          self.refs.append(value)

          for html in root.rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in html.parts):
                  continue
              parser = RefParser()
              try:
                  parser.feed(html.read_text(encoding='utf-8'))
              except UnicodeDecodeError:
                  continue
              for ref in parser.refs:
                  parsed = urlparse(ref)
                  if parsed.scheme or ref.startswith(('#', '//')) or not parsed.path:
                      continue
                  target = (root / parsed.path.lstrip('/')) if parsed.path.startswith('/') else (html.parent / parsed.path)
                  target = target.resolve()
                  if root not in target.parents and target != root:
                      continue
                  if not target.exists():
                      missing.append(f'{html.relative_to(root)} -> {ref}')

          if missing:
              print('Missing local HTML references:')
              print('\n'.join(f'  - {item}' for item in missing))
              sys.exit(1)
          print('All local HTML href/src references exist.')
          PY

  build-android:
    name: Build ZakiChat Android APK
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ZakiChat
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences and install packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle existing ZakiChat web app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='supabase/' \
            --exclude='node_modules/' \
            ./ android/app/src/main/assets/

      - name: Download Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug and release APKs
        run: /tmp/gradle-8.9/bin/gradle --no-daemon -p android assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZakiChat-Android-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="zc-vr15-android"
          APK_RELEASE="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEBUG="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_RELEASE" "$APK_DEBUG" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_RELEASE" "$APK_DEBUG" \
              --title "ZakiChat Android zc-vr15" \
              --notes "Installable ZakiChat Android test APKs. The floating bubble requires Android's Display over other apps permission. Please test sign-in, messaging, bubble behavior, and dismiss-from-Recents behavior on the target phone."
          fi
