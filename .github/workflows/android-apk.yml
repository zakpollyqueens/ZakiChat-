name: ZakiChat Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "pages/**"
      - "static/**"
      - "index.html"
      - "manifest.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm Android source is present
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/zakmolanitech/zakichat/FloatingBubbleService.java
          echo "Android wrapper and floating bubble source are present."
