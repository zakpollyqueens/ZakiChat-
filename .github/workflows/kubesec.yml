name: Static Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 11 * * 3'

permissions:
  contents: read

jobs:
  secret-pattern-scan:
    name: Check for accidentally committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Scan tracked source for common live-secret formats
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{24,}|sk_live_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.bak*'; then
            echo "::error::Potential secret material found in tracked source. Remove it and rotate the credential."
            exit 1
          else
            echo "No common live-secret patterns found in tracked source."
          fi
