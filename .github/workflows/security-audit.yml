name: Zamivox Static Security Audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zamivox-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect source, secrets and Android resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Scan for accidental secrets and committed environment files
        run: python3 scripts/security_audit.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find static/js -type f -name '*.js' -print0)
          echo "JavaScript syntax checked: $count files"

      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = [Path("android/app/src/main/AndroidManifest.xml")]
          files += list(Path("android/app/src/main/res").rglob("*.xml"))
          for file in files:
              ET.parse(file)
          print(f"Android XML files validated: {len(files)}")
          PY
