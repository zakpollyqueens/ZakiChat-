plugins {
    id 'com.android.application'
}

def ciBuildNumber = System.getenv('GITHUB_RUN_NUMBER')
def appVersionCode = ciBuildNumber != null ? 10000 + ciBuildNumber.toInteger() : 18

android {
    namespace 'com.zakmolanitech.zakichat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zakmolanitech.zakichat'
        minSdk 23
        targetSdk 33
        versionCode appVersionCode
        versionName 'zc-vr18'
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI-signed test build for direct installation. Replace with a private release keystore before production distribution.
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    // AndroidX dependencies may still request the legacy split Kotlin stdlib artifacts.
    // Redirect them to the unified stdlib module so Gradle cannot package duplicate classes.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useTarget('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
            details.because('Use unified Kotlin stdlib to avoid duplicate classes')
        }
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
}
