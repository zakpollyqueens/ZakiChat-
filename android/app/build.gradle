plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zakmolanitech.zakichat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zakmolanitech.zakichat'
        minSdk 23
        targetSdk 28
        versionCode 15
        versionName 'zc-vr15'
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI-signed test build for direct installation. Replace with a private release keystore before production distribution.
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    // Kotlin 1.8+ folds these JDK-specific stdlib artifacts into kotlin-stdlib.
    // Excluding the older split jars avoids duplicate classes from transitive AndroidX dependencies.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
}
