<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06130f">
  <title>Admin Sign In | ZakiChat</title>
  <link rel="stylesheet" href="../static/css/admin.css">
</head>

<body class="admin-page">

  <main class="admin-shell">

    <section class="admin-card" aria-labelledby="adminTitle">

      <div class="admin-visual" aria-hidden="true">
        <div class="admin-lamp">
          <div class="admin-lamp-glow"></div>
          <div class="admin-lamp-head"></div>
          <div class="admin-lamp-beam"></div>
        </div>

        <div class="admin-mascot">
          <span class="admin-mascot-eye"></span>
          <span class="admin-mascot-eye"></span>
          <span class="admin-mascot-smile"></span>
        </div>
      </div>

      <div class="admin-brand">
        <div class="admin-brand-mark">Z</div>
        <h1 id="adminTitle">Welcome Back</h1>
        <p>ZakiChat Administrator Portal</p>
      </div>

      <form id="adminLoginForm" novalidate>

        <div class="admin-field">
          <label for="adminEmail">Admin Email</label>
          <input
            id="adminEmail"
            name="adminEmail"
            type="email"
            autocomplete="username"
            placeholder="Enter admin email"
            required
          >
        </div>

        <div class="admin-field">
          <label for="adminPasscode">Passcode</label>
          <input
            id="adminPasscode"
            name="adminPasscode"
            type="password"
            autocomplete="off"
            placeholder="Enter admin passcode"
            required
          >
        </div>

        <div class="admin-field">
          <label for="adminPassword">Password</label>
          <input
            id="adminPassword"
            name="adminPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >
        </div>

        <button class="admin-button" type="submit">
          Sign In
        </button>

        <div
          id="adminMessage"
          class="admin-message"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </main>

  <script src="../static/js/admin.js?v=zc-vr15-admin2"></script>

</body>
</html>
