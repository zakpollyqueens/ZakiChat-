<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>Admin | ZakiChat</title>

  <link rel="stylesheet" href="../static/css/admin.css">
</head>

<body class="admin-page">

  <main class="admin-shell">

    <section class="admin-card">

      <div class="admin-brand">
        <div class="admin-brand-mark">Z</div>
        <h1>ZakiChat Admin</h1>
        <p>Secure administration portal</p>
      </div>

      <form id="adminLoginForm">

        <div class="admin-field">
          <label for="adminEmail">Administrator email</label>
          <input
            id="adminEmail"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="admin-field">
          <label for="adminPassword">Password</label>
          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="admin-button" type="submit">
          Secure Sign In
        </button>

        <div
          id="adminMessage"
          class="admin-message"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/admin.js"></script>

</body>
</html>
