<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked Users | ZakiChat</title>

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
  <link rel="stylesheet" href="../static/css/blocked-users.css">
</head>

<body>
  <main class="blocked-users-page">

    <header class="blocked-users-header">
      <a href="settings.html" class="back-button" aria-label="Back to Settings">‹</a>

      <div>
        <h1>Blocked Users</h1>
        <p>Manage people you have blocked on ZakiChat.</p>
      </div>
    </header>

    <section class="blocked-card">
      <div class="section-heading">
        <span class="section-icon">🚫</span>

        <div>
          <h2>Your blocked users</h2>
          <p>Review people you have blocked and unblock them when needed.</p>
        </div>
      </div>

      <button
        type="button"
        id="openBlockUser"
        class="block-user-button"
      >
        <span>＋</span>
        <span>Block a user</span>
      </button>

      <div id="blockedUsersList" class="blocked-users-list"></div>
    </section>

    <section class="blocked-card info-card">
      <div class="info-icon">ℹ️</div>

      <div>
        <strong>Blocking on ZakiChat</strong>
        <p>
          Blocking is designed to keep unwanted conversations away from your
          account. You can unblock a user whenever you choose.
        </p>
      </div>
    </section>

  </main>

  <script src="../static/js/blocked-users.js"></script>
</body>
</html>
