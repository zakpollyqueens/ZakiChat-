<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>My Profile | ZakiChat</title>

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/profile.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
</head>

<body class="profile-page">

  <main class="profile-shell">

    <header class="profile-topbar">
      <a class="profile-back" href="chats.html" aria-label="Back to chats">
        <span>←</span>
      </a>

      <div>
        <span class="eyebrow">ZAKICHAT</span>
        <h1>My Profile</h1>
      </div>

      <button
        type="button"
        class="topbar-save"
        id="saveTopButton"
        hidden
      >
        Save
      </button>
    </header>

    <section class="profile-card">

      <div class="profile-hero">

        <div class="avatar-wrap">
          <div
            class="profile-avatar"
            id="profileAvatar"
            aria-label="Profile avatar"
          >
            <span id="avatarInitials">?</span>
          </div>

          <button
            type="button"
            class="avatar-edit"
            id="avatarEditButton"
            aria-label="Change profile photo"
            title="Change profile photo"
          >
            ✎
          </button>

          <input
            type="url"
            id="avatarUrl"
            class="avatar-url-input"
            placeholder="Profile image URL"
            autocomplete="url"
            hidden
          >
        </div>

        <div class="profile-identity">
          <h2 id="profileDisplayName">Loading...</h2>
          <p id="profileUsername">@username</p>

          <span class="presence-badge" id="profilePresence">
            <i></i>
            <span>Offline</span>
          </span>
        </div>

      </div>

      <div class="profile-divider"></div>

      <form id="profileForm" novalidate>

        <div class="section-heading">
          <span class="section-label">ACCOUNT</span>
          <h3>Your information</h3>
          <p>
            Keep your ZakiChat profile information up to date.
          </p>
        </div>

        <div class="profile-fields">

          <label class="profile-field">
            <span>Username</span>
            <div class="field-wrap">
              <span class="field-prefix">@</span>
              <input
                type="text"
                id="username"
                maxlength="30"
                autocomplete="username"
                placeholder="username"
                required
              >
            </div>
            <small>3–30 letters, numbers, underscores or dots.</small>
          </label>

          <label class="profile-field">
            <span>Full name</span>
            <input
              type="text"
              id="fullName"
              maxlength="80"
              autocomplete="name"
              placeholder="Your full name"
            >
          </label>

          <label class="profile-field">
            <span>Phone number</span>
            <input
              type="tel"
              id="phone"
              maxlength="30"
              autocomplete="tel"
              placeholder="+256..."
            >
          </label>

          <label class="profile-field">
            <span>General location</span>
            <input
              type="text"
              id="location"
              maxlength="100"
              autocomplete="address-level2"
              placeholder="City or general area"
            >
            <small>Use a general area rather than a precise address.</small>
          </label>

          <label class="profile-field profile-field-full">
            <span>About you</span>
            <textarea
              id="bio"
              maxlength="160"
              rows="4"
              placeholder="Tell people a little about yourself..."
            ></textarea>

            <div class="character-count">
              <span id="bioCount">0</span>/160
            </div>
          </label>

          <label class="profile-field profile-field-full">
            <span>Profile image URL</span>
            <input
              type="url"
              id="avatarUrlVisible"
              maxlength="500"
              autocomplete="url"
              placeholder="https://..."
            >
            <small>
              An image URL can be used now; direct Supabase image upload
              will be added with the storage layer.
            </small>
          </label>

        </div>

        <div
          class="profile-message"
          id="profileMessage"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <div class="profile-actions">
          <button
            type="submit"
            class="primary-button"
            id="saveButton"
          >
            <span>Save Changes</span>
          </button>

          <button
            type="button"
            class="secondary-button"
            id="cancelButton"
          >
            Cancel
          </button>
        </div>

      </form>

    </section>

    <section class="profile-info-card">
      <div class="info-icon">🔐</div>

      <div>
        <h3>Your account data</h3>
        <p>
          Your profile is connected to your ZakiChat account.
          Changes are saved securely to your Supabase profile.
        </p>
      </div>
    </section>

    <button
      type="button"
      class="logout-button"
      id="logoutButton"
    >
      Log Out
    </button>

  </main>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
    hidden
  ></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
<script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/profile.js"></script>

</body>
</html>
