<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Groups | ZakiChat</title>
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/groups.css">
</head>

<body>
<main class="groups-page">
  <section class="groups-shell">

    <header class="groups-head">
      <div class="groups-title">
        <img src="../static/images/icon.jpg" alt="ZakiChat">
        <div>
          <h1>Groups</h1>
          <p>Create communities and stay connected.</p>
        </div>
      </div>

      <button class="create-group-btn" id="openCreateGroup" type="button">
        <span>＋</span>
        <span class="label">Create Group</span>
      </button>
    </header>

    <div class="group-search">
      <span>⌕</span>
      <input id="groupSearch" type="search"
             placeholder="Search groups">
    </div>

    <section class="groups-grid" id="groupsList"></section>

    <div class="empty-groups" id="emptyGroups" hidden>
      <strong>No groups found</strong>
      <span>Try another group name.</span>
    </div>

  </section>
</main>

<div class="modal-backdrop" id="createGroupModal" aria-hidden="true">
  <section class="create-group-modal"
           role="dialog"
           aria-modal="true"
           aria-labelledby="createGroupTitle">

    <button class="modal-close"
            id="closeCreateGroup"
            type="button"
            aria-label="Close">×</button>

    <h2 id="createGroupTitle">Create a group</h2>

    <p>
      Create a space where people can chat and share ideas.
    </p>

    <form id="createGroupForm" class="group-form">

      <label class="form-label">
        Group name
        <input
          id="groupName"
          class="group-input"
          type="text"
          maxlength="80"
          placeholder="Enter group name"
          required>
      </label>

      <label class="form-label">
        Description
        <textarea
          id="groupDescription"
          class="group-input group-textarea"
          maxlength="180"
          placeholder="What is this group about?"></textarea>
      </label>

      <div class="group-contact-picker">
        <div class="group-picker-head">
          <strong>Select contacts</strong>
          <span id="groupSelectedCount">0 selected</span>
        </div>
        <input id="groupContactSearch" class="group-input" type="search" placeholder="Search contacts">
        <div id="groupContactList" class="group-contact-list">
          <div class="group-picker-empty">Loading your contacts...</div>
        </div>
      </div>

      <div class="form-message" id="groupMessage"></div>

      <button class="save-group-btn" type="submit">
        ＋ Create Group
      </button>

    </form>
  </section>
</div>

<script src="../static/js/appearance.js"></script>
<script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
<script src="../static/js/supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../static/js/groups.js"></script>
</body>
</html>
