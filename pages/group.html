<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Group conversation on ZakiChat.">
<title>Group | ZakiChat</title>

<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/groups.css">
</head>

<body>

<main class="group-chat-page">

  <header class="group-chat-header">

    <a
      href="groups.html"
      class="group-back"
      aria-label="Back to groups">
      ←
    </a>

    <div class="group-chat-identity">

      <div
        class="group-chat-avatar"
        id="groupAvatar">
        ZG
      </div>

      <div>
        <strong id="groupTitle">
          ZakiChat Group
        </strong>

        <span id="groupMembers">
          Loading members...
        </span>
      </div>

    </div>

    <button
      class="group-menu-button"
      id="groupMenuButton"
      type="button"
      aria-label="Group menu">
      ⋮
    </button>

  </header>


  <section
    class="group-messages"
    id="groupMessages"
    aria-live="polite"
    aria-label="Group messages">
  </section>


  <form
    class="group-composer"
    id="groupComposer">

    <button
      class="group-attach-button"
      type="button"
      id="groupAttachButton"
      aria-label="Attach"
      title="Attachments">
      ＋
    </button>

    <input
      id="groupMessageInput"
      type="text"
      maxlength="2000"
      autocomplete="off"
      aria-label="Message"
      placeholder="Type a message...">

    <button
      class="group-send-button"
      type="submit"
      aria-label="Send message">
      ➤
    </button>

  </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/messages.js"></script>
<script src="../static/js/realtime.js"></script>
<script src="../static/js/group.js"></script>

</body>
</html>
