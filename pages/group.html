<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Group | ZakiChat</title>
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/groups.css">
</head>
<body>

<main class="group-chat-page">

  <header class="group-chat-header">
    <a href="groups.html"
       class="group-back"
       aria-label="Back to groups">←</a>

    <button
      class="group-chat-identity"
      id="groupInfoButton"
      type="button"
      aria-label="Open group information">

      <div class="group-chat-avatar" id="groupAvatar">ZG</div>

      <div>
        <strong id="groupTitle">ZakiChat Group</strong>
        <span id="groupMembers">Group members</span>
      </div>

    </button>

    <button
      class="group-menu-button"
      id="groupMenuButton"
      type="button"
      aria-label="Group menu">⋮</button>
  </header>

  <section
    class="group-messages"
    id="groupMessages"
    aria-live="polite">
  </section>

  <form
    class="group-composer"
    id="groupComposer">

    <button
      class="group-attach-button"
      type="button"
      id="groupAttachButton"
      aria-label="Attach">＋</button>

    <input
      id="groupMessageInput"
      type="text"
      maxlength="2000"
      autocomplete="off"
      placeholder="Type a message...">

    <button
      class="group-send-button"
      type="submit"
      aria-label="Send message">➤</button>

  </form>

</main>


<!-- ======================================================
     GROUP INFO OVERLAY
====================================================== -->

<div
  class="group-info-overlay"
  id="groupInfoOverlay"
  hidden>

  <aside
    class="group-info-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="groupInfoTitle">

    <header class="group-info-header">

      <div>
        <span class="group-info-kicker">GROUP INFORMATION</span>
        <h2 id="groupInfoTitle">Group Info</h2>
      </div>

      <button
        class="group-info-close"
        id="groupInfoClose"
        type="button"
        aria-label="Close group information">×</button>

    </header>


    <!-- GROUP SUMMARY -->

    <section class="group-profile-card">

      <div
        class="group-profile-avatar"
        id="groupInfoAvatar">ZG</div>

      <div class="group-profile-copy">
        <h3 id="groupInfoName">ZakiChat Group</h3>
        <p id="groupInfoDescription">
          No group description.
        </p>
      </div>

    </section>


    <!-- EDIT GROUP -->

    <section
      class="group-management-section"
      id="groupEditSection"
      hidden>

      <div class="group-section-heading">
        <div>
          <span>GROUP DETAILS</span>
          <strong>Edit group</strong>
        </div>
      </div>

      <form id="groupEditForm">

        <label class="group-field">
          <span>Group name</span>
          <input
            id="groupEditName"
            type="text"
            maxlength="80"
            autocomplete="off">
        </label>

        <label class="group-field">
          <span>Description</span>
          <textarea
            id="groupEditDescription"
            maxlength="180"
            rows="3"></textarea>
        </label>

        <div class="group-form-actions">
          <button
            type="button"
            class="group-secondary-button"
            id="groupEditCancel">
            Cancel
          </button>

          <button
            type="submit"
            class="group-primary-button"
            id="groupEditSave">
            Save changes
          </button>
        </div>

      </form>

    </section>


    <!-- MEMBERS -->

    <section class="group-management-section">

      <div class="group-section-heading">

        <div>
          <span>MEMBERS</span>
          <strong id="groupMemberCount">0 members</strong>
        </div>

        <button
          type="button"
          class="group-add-button"
          id="groupAddMemberButton"
          hidden>
          + Add
        </button>

      </div>

      <div
        class="group-member-list"
        id="groupMemberList">
      </div>

    </section>


    <!-- ADD MEMBERS -->

    <section
      class="group-management-section"
      id="groupAddSection"
      hidden>

      <div class="group-section-heading">
        <div>
          <span>ADD MEMBERS</span>
          <strong>Choose a ZakiChat user</strong>
        </div>
      </div>

      <input
        class="group-member-search"
        id="groupMemberSearch"
        type="search"
        placeholder="Search by name or username"
        autocomplete="off">

      <div
        class="group-user-results"
        id="groupUserResults">
      </div>

    </section>


    <!-- ACTIONS -->

    <section class="group-danger-section">

      <button
        type="button"
        class="group-leave-button"
        id="groupLeaveButton">
        Leave group
      </button>

      <p
        class="group-action-note"
        id="groupActionNote">
      </p>

    </section>

  </aside>
</div>


<div
  class="group-toast"
  id="groupToast"
  role="status"
  aria-live="polite">
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
<script src="../static/js/supabase-client.js"></script>
<script src="../static/js/messages.js"></script>
<script src="../static/js/realtime.js"></script>
<script src="../static/js/group.js"></script>

</body>
</html>
