<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sign in securely to ZakiChat.">
<meta name="theme-color" content="#07111f">
<title>Sign In | ZakiChat</title>
<link rel="icon" href="../static/images/icon.jpg" type="image/jpeg">
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/auth.css">
<link rel="stylesheet" href="../static/css/signature-theme.css">
</head>
<body class="auth-page">
<main class="auth-shell">
  <a href="../index.html" class="auth-brand"><img src="../static/images/icon.jpg" alt="ZakiChat logo"><span>Zaki<span>Chat</span></span></a>
  <section class="auth-card">
    <div class="auth-heading"><span class="section-label">WELCOME BACK</span><h1>Sign in to ZakiChat</h1><p>Continue your conversations and stay connected.</p></div>
    <form id="loginForm" class="auth-form">
      <label for="email">Recovery email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button></div>
      <div class="auth-row"><span class="auth-help">Your verified email keeps your account recoverable.</span><a href="#" id="forgotPassword">Reset password by email</a></div>
      <button type="submit" class="button button-primary auth-submit">Sign In</button>
      <p id="loginMessage" class="auth-message" role="status" aria-live="polite"></p>
    </form>
    <div class="auth-divider"><span>OR</span></div>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
  </section>
  <p class="auth-footer">© 2026 ZakiChat · A Zakmolanitech Solutions project</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/account-manager.js"></script>
<script src="../static/js/supabase-client.js"></script>
<script src="../static/js/auth.js?v=zc-email-only-20261011-2"></script>

<script src="../static/js/service-worker.js" defer></script>
</body></html>
