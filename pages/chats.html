<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="ZakiChat conversations.">
<meta name="theme-color" content="#07111f">
<title>Chats | ZakiChat</title>
<link rel="icon" href="../static/images/icon.jpg" type="image/jpeg">
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/chat.css">
<link rel="stylesheet" href="../static/css/responsive.css">
</head>

<body class="chat-page">

<div class="app-shell">

  <aside class="sidebar">

    <div class="sidebar-top">
      <a href="../index.html" class="app-brand">
        <img src="../static/images/icon.jpg" alt="ZakiChat">
        <strong>ZakiChat</strong>
      </a>

      <button class="icon-button" aria-label="More options">⋮</button>
    </div>

    <div class="search-box">
      <span>⌕</span>
      <input type="search" placeholder="Search conversations" aria-label="Search conversations">
    </div>

    <nav class="chat-tabs" aria-label="Conversation filters">
      <button class="active">All</button>
      <button>Unread</button>
      <button>Groups</button>
    </nav>

    <div class="conversation-list" id="conversation-list">
      <div class="conversation-loading">
        Loading conversations...
      </div>
    </div>
          <div class="conversation-line">
            <span>Hey! How are you?</span>
            <b class="unread-count">2</b>
          </div>
        </div>
      </a>

      <a href="#" class="conversation">
        <div class="conversation-avatar">B</div>
        <div class="conversation-info">
          <div class="conversation-line">
            <strong>Brian</strong>
            <time>09:58</time>
          </div>
          <div class="conversation-line">
            <span>See you tomorrow 👍</span>
          </div>
        </div>
      </a>

      <a href="#" class="conversation">
        <div class="conversation-avatar group-avatar">T</div>
        <div class="conversation-info">
          <div class="conversation-line">
            <strong>Tech Team</strong>
            <time>09:31</time>
          </div>
          <div class="conversation-line">
            <span>David: New project update</span>
          </div>
        </div>
      </a>

      <a href="#" class="conversation">
        <div class="conversation-avatar">J</div>
        <div class="conversation-info">
          <div class="conversation-line">
            <strong>John</strong>
            <time>Yesterday</time>
          </div>
          <div class="conversation-line">
            <span>Thanks!</span>
          </div>
        </div>
      </a>

    </div>

    <nav class="bottom-nav" aria-label="Main app navigation">
      <a class="selected" href="chats.html"><span>💬</span>Chats</a>
      <a href="contacts.html"><span>👥</span>Contacts</a>
      <a href="groups.html"><span>👨‍👩‍👧</span>Groups</a>
      <a href="notifications.html"><span>🔔</span>Updates</a>
      <a href="settings.html"><span>⚙️</span>Settings</a>
    </nav>

  </aside>

  <main class="chat-main">

    <header class="chat-header">
      <div class="chat-user">
        <div class="conversation-avatar gradient-avatar">Z</div>
        <div>
          <strong>Select a chat</strong>
          <span>Choose a conversation to start chatting</span>
        </div>
      </div>

      <div class="chat-actions">
        <button
          class="icon-button"
          type="button"
          id="refresh-chat"
          aria-label="Refresh chat"
          title="Refresh chat"
        >↻</button>
        <button class="icon-button" type="button" aria-label="Search">⌕</button>
        <button class="icon-button" aria-label="More options">⋮</button>
      </div>
    </header>

    <section class="messages-panel"></section>

    <div
      class="message-edit-bar"
      id="message-edit-bar"
      hidden
    >
      <div class="message-edit-info">
        <strong>Editing message</strong>
        <span id="message-edit-preview"></span>
      </div>

      <button
        type="button"
        class="edit-cancel-button"
        id="cancel-message-edit"
        aria-label="Cancel editing"
        title="Cancel editing"
      >×</button>
    </div>

    <form class="message-composer">
      <button type="button" class="composer-button" aria-label="Attach file">＋</button>
      <input type="text" placeholder="Write a message..." aria-label="Message">
      <button type="button" class="composer-button" aria-label="Emoji">☺</button>
      <button
        type="submit"
        class="send-button"
        id="send-message-button"
        aria-label="Send message"
        title="Send message"
      >➤</button>
    </form>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/auth-guard.js"></script>
<script src="../static/js/conversations.js"></script>
<script src="../static/js/realtime.js"></script>
<script src="../static/js/conversation-list.js"></script>
<script src="../static/js/messages.js"></script>
<script src="../static/js/chat.js"></script>
</body>
</html>
