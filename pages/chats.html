<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="ZakiChat conversations.">
<meta name="theme-color" content="#07111f">
<title>Chats | ZakiChat</title>
<link rel="icon" href="../static/images/icon.jpg" type="image/jpeg">
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/chat.css">
<link rel="stylesheet" href="../static/css/responsive.css">
<link rel="stylesheet" href="../static/css/zaki-keyboard.css">
</head>

<body class="chat-page">

<div class="app-shell">

  <aside class="sidebar">

    <div class="sidebar-top">
      <a href="../index.html" class="app-brand">
        <img src="../static/images/icon.jpg" alt="ZakiChat">
        <strong>ZakiChat</strong>
      </a>

      <div class="top-actions">
        <button
          type="button"
          class="icon-button"
          id="top-search-button"
          aria-label="Search"
          title="Search"
        >⌕</button>
        <a
          href="status.html"
          class="updates-indicator"
          id="top-updates-indicator"
          aria-label="Updates"
          title="Updates"
        >
          <span class="updates-indicator-icon" aria-hidden="true">◌</span>
        </a>



        <button
          type="button"
          class="icon-button"
          id="top-more-button"
          aria-label="More options"
          aria-expanded="false"
          aria-controls="top-more-menu"
          title="More options"
        >⋮</button>

        <div
          class="top-more-wrapper"
          id="top-more-wrapper"
        >
          <div
            class="top-more-menu"
            id="top-more-menu"
            hidden
            role="menu"
            aria-label="ZakiChat menu"
          >
            <a href="notifications.html" role="menuitem">🔔 <span>Notifications</span></a>
            <button type="button" role="menuitem" id="menu-search">⌕ <span>Search</span></button>
            <a href="people.html" role="menuitem">👤 <span>New Contact</span></a>
            <a href="groups.html" role="menuitem">👥 <span>New Group</span></a>
            <a href="security.html" role="menuitem">🔒 <span>Security</span></a>
            <a href="appearance.html" role="menuitem" id="menu-appearance">🎨 <span>Appearance</span></a>
            <a href="language.html" role="menuitem">🌐 <span>Language</span></a>
            <a href="settings.html" role="menuitem">⚙ <span>Settings</span></a>
            <a href="../index.html" role="menuitem">ℹ <span>About</span></a>
          </div>
        </div>
      </div>
    </div>

    <div class="search-box">
      <span>⌕</span>
      <input type="search" placeholder="Search conversations" aria-label="Search conversations">
    </div>

    <nav class="chat-tabs" id="chat-tabs" aria-label="Conversation filters">
      <button type="button" class="active" data-filter="all">All</button>
      <button type="button" data-filter="unread">Unread</button>
      <button type="button" data-filter="favorites">Favorites</button>
      <button type="button" data-filter="groups">Groups</button>
    </nav>

    <div class="conversation-list" id="conversation-list">
      <div class="conversation-loading">
        Loading conversations...
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Main app navigation">
    <a class="selected" href="chats.html" aria-current="page" data-nav-key="chats">
      <span class="bottom-nav-icon" aria-hidden="true">💬</span>
      <span>Chats</span>
    </a>

    <a href="settings.html" class="bottom-nav-item" data-nav-key="settings">
      <span class="bottom-nav-icon" aria-hidden="true">⚙️</span>
      <span>Settings</span>
    </a>

    <a href="status.html" class="bottom-nav-item" data-nav-key="updates">
      <span class="bottom-nav-icon" aria-hidden="true">🔔</span>
      <span>Updates</span>
    </a>

    <a href="status.html#callsHeading" class="bottom-nav-item" data-nav-key="calls">
      <span class="bottom-nav-icon" aria-hidden="true">📞</span>
      <span>Calls</span>
    </a>

    <a href="profile.html" class="bottom-nav-item" data-nav-key="profile">
      <span class="bottom-nav-icon" aria-hidden="true">👤</span>
      <span>Profile</span>
    </a>
  </nav>

    <div class="quick-create">
      <button
        type="button"
        class="quick-create-button"
        id="quick-create-button"
        aria-label="Create new"
        aria-expanded="false"
        aria-controls="quick-create-menu"
        title="Create new"
      >
        <span aria-hidden="true">＋</span>
      </button>

      <div
        class="quick-create-menu"
        id="quick-create-menu"
        hidden
        aria-label="Create new"
      >
        <a href="contacts.html?mode=chat" class="quick-create-item">
          <span aria-hidden="true">💬</span>
          <span>New Chat</span>
        </a>

        <a href="contacts.html" class="quick-create-item">
          <span aria-hidden="true">👤</span>
          <span>New Contact</span>
        </a>

        <a href="groups.html" class="quick-create-item">
          <span aria-hidden="true">👥</span>
          <span>New Group</span>
        </a>
      </div>
    </div>

  </aside>

  
</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../static/js/appearance.js"></script>
<script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
<script src="../static/js/supabase-client.js"></script>
<script src="../static/js/service-worker.js"></script>
<script src="../static/js/auth-guard.js"></script>
<script src="../static/js/conversations.js"></script>
<script src="../static/js/realtime.js"></script>
<script src="../static/js/notification-badge.js"></script>
<script src="../static/js/browser-notifications.js"></script>
<script src="../static/js/conversation-list.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!window.ZakiNotificationBadge || !window.ZakiChatConfig) return;

  const client = window.ZakiChatAuth?.client;

  if (!client) {
    console.error("ZakiChat Supabase client is unavailable.");
    return;
  }

  const { data } = await client.auth.getSession();

  if (data?.session?.user?.id) {
    window.ZakiNotificationBadge.init(
      window.ZakiChatConfig,
      data.session.user.id
    );
  }
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.ZakiKeyboard) window.ZakiKeyboard.init();
});
</script>
<script src="../static/js/chat-top-actions.js"></script>
<script src="../static/js/quick-create.js"></script>
</body>
</html>
