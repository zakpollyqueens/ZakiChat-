<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Molan Chat | App Language</title>

  <link rel="stylesheet" href="../static/css/main.css">

  <link rel="stylesheet" href="../static/css/responsive.css">
  <link rel="stylesheet" href="../static/css/settings.css">
  <link rel="stylesheet" href="../static/css/language.css">
  <link rel="stylesheet" href="../static/css/signature-theme.css">
</head>

<body class="settings-page language-page">
  <main class="settings-shell">

    <header class="settings-header language-header">
      <a
        class="settings-back"
        href="settings.html"
        aria-label="Back to Settings"
      >←</a>

      <span class="settings-eyebrow">MOLAN CHAT</span>

      <h1 data-i18n="language.title">
        App language
      </h1>

      <p data-i18n="language.description">
        Select your preferred language for Molan Chat.
      </p>
    </header>

    <section class="language-panel">

      <div class="language-search">
        <span aria-hidden="true">🔎</span>

        <input
          id="languageSearch"
          type="search"
          autocomplete="off"
          data-i18n-placeholder="language.search"
          placeholder="Search languages"
          aria-label="Search languages"
        >
      </div>

      <div
        id="languageList"
        class="language-list"
        role="listbox"
        aria-label="Available languages"
      ></div>

    </section>

    <p
      id="languageMessage"
      class="settings-message"
      aria-live="polite"
    ></p>

  </main>

  <nav class="zc-bottom-nav" aria-label="Main navigation">
  <a href="chats.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 3v-3H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><path d="M8 10h8M8 14h5"/></svg><span>Chats</span></a>
  <a href="contacts.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.3-3 2.2-4.8 5.5-4.8s5.2 1.8 5.5 4.8"/><path d="M16 5.5a3 3 0 0 1 0 5.8M17 14.5c2.3.5 3.5 2 3.7 4.5"/></svg><span>Contacts</span></a>
  <a href="settings.html" class="is-current" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="m19.4 13.8 1.1.9-1.6 2.8-1.4-.5a7.7 7.7 0 0 1-1.7 1l-.3 1.5h-3.2l-.3-1.5a7.7 7.7 0 0 1-1.7-1l-1.4.5-1.6-2.8 1.1-.9a7.2 7.2 0 0 1 0-2l-1.1-.9 1.6-2.8 1.4.5a7.7 7.7 0 0 1 1.7-1l.3-1.5h3.2l.3 1.5a7.7 7.7 0 0 1 1.7 1l1.4-.5 1.6 2.8-1.1.9a7.2 7.2 0 0 1 0 2Z"/></svg><span>Settings</span></a>
  <a href="status.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></svg><span>Updates</span></a>
  <a href="profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.4-4.1 3-6.2 7.5-6.2s7.1 2.1 7.5 6.2"/></svg><span>Profile</span></a>
</nav>

  <script src="../static/js/i18n.js"></script>
  <script src="../static/js/language.js"></script>
<script src="../static/js/appearance.js"></script>
</body>
</html>
