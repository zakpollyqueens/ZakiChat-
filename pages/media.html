<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#07121b">

  <title>Media, Links & Docs | ZakiChat</title>

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/media.css">
</head>

<body class="media-page">

  <main class="media-shell">

    <header class="media-header">
      <a
        class="media-back"
        href="javascript:history.back()"
        aria-label="Go back"
      >←</a>

      <div class="media-title">
        <span>CHAT CONTENT</span>
        <h1>Media, Links &amp; Docs</h1>
        <small id="mediaContactName">
          Conversation content
        </small>
      </div>
    </header>

    <section class="media-tabs" aria-label="Content type">

      <button
        type="button"
        class="media-tab active"
        data-media-tab="media"
      >
        <span class="tab-icon">▣</span>
        <span>Media</span>
      </button>

      <button
        type="button"
        class="media-tab"
        data-media-tab="links"
      >
        <span class="tab-icon">↗</span>
        <span>Links</span>
      </button>

      <button
        type="button"
        class="media-tab"
        data-media-tab="docs"
      >
        <span class="tab-icon">▤</span>
        <span>Docs</span>
      </button>

    </section>

    <section class="media-panel">

      <div class="media-panel-top">
        <div>
          <strong id="mediaPanelTitle">
            Media
          </strong>

          <small id="mediaPanelCount">
            Shared photos and videos
          </small>
        </div>

        <span class="content-count" id="contentCount">
          0
        </span>
      </div>

      <div
        class="media-empty"
        id="mediaEmpty"
      >
        <div class="empty-icon" id="emptyIcon">
          ▣
        </div>

        <strong id="mediaEmptyTitle">
          No media yet
        </strong>

        <span id="mediaEmptyText">
          Photos and videos shared in this chat
          will appear here.
        </span>
      </div>

    </section>

    <div
      id="mediaMessage"
      class="media-message"
      hidden
      role="status"
      aria-live="polite"
    ></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/media.js"></script>

  <script>
    (() => {
      "use strict";

      const params =
        new URLSearchParams(
          window.location.search
        );

      const userId =
        String(params.get("user") || "").trim();

      const tabs =
        document.querySelectorAll(
          "[data-media-tab]"
        );

      const title =
        document.getElementById(
          "mediaPanelTitle"
        );

      const count =
        document.getElementById(
          "contentCount"
        );

      const description =
        document.getElementById(
          "mediaPanelCount"
        );

      const emptyTitle =
        document.getElementById(
          "mediaEmptyTitle"
        );

      const emptyText =
        document.getElementById(
          "mediaEmptyText"
        );

      const emptyIcon =
        document.getElementById(
          "emptyIcon"
        );

      const contact =
        document.getElementById(
          "mediaContactName"
        );

      const content = {
        media: {
          title: "Media",
          description: "Shared photos and videos",
          emptyTitle: "No media yet",
          emptyText:
            "Photos and videos shared in this chat will appear here.",
          icon: "▣"
        },

        links: {
          title: "Links",
          description: "Links shared in this chat",
          emptyTitle: "No links yet",
          emptyText:
            "Links shared in this conversation will appear here.",
          icon: "↗"
        },

        docs: {
          title: "Documents",
          description: "Files and documents",
          emptyTitle: "No documents yet",
          emptyText:
            "Documents shared in this conversation will appear here.",
          icon: "▤"
        }
      };

      function showTab(type) {
        const item =
          content[type] || content.media;

        tabs.forEach(tab => {
          tab.classList.toggle(
            "active",
            tab.dataset.mediaTab === type
          );
        });

        title.textContent =
          item.title;

        description.textContent =
          item.description;

        emptyTitle.textContent =
          item.emptyTitle;

        emptyText.textContent =
          item.emptyText;

        emptyIcon.textContent =
          item.icon;

        count.textContent = "0";
      }

      tabs.forEach(tab => {
        tab.addEventListener(
          "click",
          () => {
            showTab(
              tab.dataset.mediaTab
            );
          }
        );
      });

      if (!userId) {
        contact.textContent =
          "Conversation content";
      } else {
        contact.textContent =
          "Shared content";
      }

      showTab("media");
    })();
  </script>

</body>
</html>
