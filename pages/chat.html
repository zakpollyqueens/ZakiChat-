<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ZakiChat</title>

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/chat.css">
  <link rel="stylesheet" href="../static/css/chat-whatsapp.css">
</head>

<body class="chat-page">

  <div class="chat-shell">

    <header class="chat-header">

      <button class="chat-back" id="back-to-chats" aria-label="Back">
        <span>‹</span>
      </button>

      <div class="chat-user" id="chat-user-button">
        <div class="conversation-avatar" id="chat-user-avatar">
          <span>?</span>
        </div>

        <div class="chat-user-details">
          <strong>Loading...</strong>
          <span>Connecting...</span>
        </div>
      </div>

      <div class="chat-header-actions">

        <button class="chat-icon-button" id="voice-call-button" type="button" aria-label="Voice call">
          ☎
        </button>

        <button class="chat-icon-button" id="video-call-button" type="button" aria-label="Video call">
          ▣
        </button>

        <button class="chat-icon-button" id="search-chat-button" type="button" aria-label="Search">
          ⌕
        </button>

        <div id="chat-more-wrapper">
          <button class="chat-icon-button" id="chat-more-button" type="button" aria-label="More">
            ⋮
          </button>

          <div id="chat-more-menu" class="chat-more-menu">
            <button data-chat-action="info">Contact info</button>
            <button data-chat-action="search">Search</button>
            <button data-chat-action="media">Media, links &amp; docs</button>
            <button data-chat-action="notifications">Notifications</button>
            <button data-chat-action="disappearing">Disappearing messages</button>
            <button data-chat-action="theme">Wallpaper &amp; theme</button>
            <button data-chat-action="starred">Starred messages</button>
            <button data-chat-action="clear">Clear chat</button>
            <button data-chat-action="export">Export chat</button>
            <button data-chat-action="block">Block</button>
            <button data-chat-action="report">Report</button>
          </div>
        </div>

      </div>
    </header>

    <section class="chat-search-bar" id="chat-search-bar" hidden>
      <input
        id="chat-search-input"
        type="search"
        placeholder="Search messages"
        autocomplete="off">
      <button id="close-chat-search" type="button" aria-label="Close">×</button>
    </section>

    <main class="messages-panel" id="messages-panel">
      <div class="chat-background-overlay"></div>

      <div class="messages-list" id="messages-list"></div>

      <div id="message-search-results" class="message-search-results" hidden></div>
    </main>

    <div id="message-reply-bar" class="message-action-bar" hidden>
      <div>
        <small>Replying to</small>
        <div id="message-reply-preview"></div>
      </div>
      <button type="button" id="cancel-message-reply">×</button>
    </div>

    <div id="message-edit-bar" class="message-action-bar" hidden>
      <div>
        <small>Editing message</small>
        <div id="message-edit-preview"></div>
      </div>
      <button type="button" id="cancel-message-edit">×</button>
    </div>

    <form class="message-composer" id="message-composer">

      <button
        type="button"
        id="emoji-button"
        aria-label="Emoji">
        ☺
      </button>

      <button
        type="button"
        id="attach-file-button"
        aria-label="Attach">
        ＋
      </button>

      <input
        type="text"
        name="message"
        placeholder="Message"
        autocomplete="off"
        enterkeyhint="send">

      <button
        type="button"
        id="voice-note-button"
        aria-label="Voice message">
        🎙
      </button>

      <button
        type="submit"
        id="send-message-button"
        aria-label="Send">
        ➤
      </button>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/appearance.js"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/messages.js"></script>
  <script src="../static/js/realtime.js"></script>
  <script src="../static/js/media.js"></script>
  <script src="../static/js/reactions.js"></script>
  <script src="../static/js/typing.js"></script>
  <script src="../static/js/forward.js"></script>
  <script src="../static/js/emoji-picker.js"></script>
  <script src="../static/js/chat-search.js"></script>
  <script src="../static/js/chat-more-menu.js"></script>
  <script src="../static/js/communication.js"></script>
  <script src="../static/js/chat.js"></script>

  <script>
    document.getElementById("back-to-chats")?.addEventListener("click", () => {
      window.location.href = "chats.html";
    });

    document.getElementById("chat-user-button")?.addEventListener("click", () => {
      const user = new URLSearchParams(location.search).get("user");
      if (user) {
        window.location.href = "profile.html?user=" + encodeURIComponent(user);
      }
    });
  </script>

</body>
</html>
