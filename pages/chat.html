<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="ZakiChat individual conversation.">
<meta name="theme-color" content="#07111f">
<title>Chat | ZakiChat</title>
<link rel="icon" href="../static/images/icon.jpg" type="image/jpeg">
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/chat.css">
<link rel="stylesheet" href="../static/css/chat-single.css">
<link rel="stylesheet" href="../static/css/responsive.css">
<link rel="stylesheet" href="../static/css/zaki-keyboard.css">
</head>

<body class="chat-page chat-single-page">

<main class="chat-main">

    <header class="chat-header">
      <a class="chat-back-button" href="chats.html" aria-label="Back to Chats" title="Back to Chats">←</a>
      <div class="chat-user">
        <div class="conversation-avatar gradient-avatar">Z</div>
        <div>
          <strong>Select a chat</strong>
          <span>Choose a conversation to start chatting</span>
        </div>
      </div>

      <div class="chat-actions">
        <button
          class="icon-button"
          type="button"
          id="refresh-chat"
          aria-label="Refresh chat"
          title="Refresh chat"
        >↻</button>
        <button
          class="icon-button chat-call-button"
          type="button"
          id="voice-call-button"
          aria-label="Voice call"
          title="Voice call"
        >📞</button>
        <button
          class="icon-button chat-call-button"
          type="button"
          id="video-call-button"
          aria-label="Video call"
          title="Video call"
        >📹</button>
        <button
          class="icon-button"
          type="button"
          id="search-chat-button"
          aria-label="Search messages"
          title="Search messages"
        >⌕</button>

        <div class="chat-more-wrapper" id="chat-more-wrapper">
          <button
            class="icon-button"
            type="button"
            id="chat-more-button"
            aria-label="More options"
            aria-expanded="false"
            aria-controls="chat-more-menu"
            title="More options"
          >⋮</button>

          <div
            class="chat-more-menu"
            id="chat-more-menu"
            hidden
            role="menu"
            aria-label="Chat options"
          >
            <button type="button" role="menuitem" data-chat-action="info">
              👤 <span>Contact info</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="search">
              ⌕ <span>Search</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="media">
              🖼️ <span>Media, links & docs</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="notifications">
              🔔 <span>Notifications</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="disappearing">
              ⏱️ <span>Disappearing messages</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="theme">
              🎨 <span>Wallpaper / Theme</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="starred">
              ⭐ <span>Starred messages</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="clear">
              🗑️ <span>Clear chat</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="export">
              📤 <span>Export chat</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="block">
              🚫 <span>Block</span>
            </button>
            <button type="button" role="menuitem" data-chat-action="report">
              ⚠️ <span>Report</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="chat-search-bar" id="chat-search-bar" hidden>
  <div class="chat-search-inner">
    <button type="button" class="icon-button" id="chat-search-close" aria-label="Close search">←</button>
    <input type="search" id="chat-search-input" placeholder="Search messages" autocomplete="off">
    <span id="chat-search-count" aria-live="polite"></span>
    <button type="button" class="icon-button" id="chat-search-prev" aria-label="Previous result">↑</button>
    <button type="button" class="icon-button" id="chat-search-next" aria-label="Next result">↓</button>
  </div>
</div>

<section class="messages-panel"></section>

    <div
      class="message-edit-bar"
      id="message-edit-bar"
      hidden
    >
      <div class="message-edit-info">
        <strong>Editing message</strong>
        <span id="message-edit-preview"></span>
      </div>

      <button
        type="button"
        class="edit-cancel-button"
        id="cancel-message-edit"
        aria-label="Cancel editing"
        title="Cancel editing"
      >×</button>
    </div>

    <div
      class="message-reply-bar"
      id="message-reply-bar"
      hidden
    >
      <div class="message-reply-info">
        <strong>Replying</strong>
        <span id="message-reply-preview"></span>
      </div>

      <button
        type="button"
        class="edit-cancel-button"
        id="cancel-message-reply"
        aria-label="Cancel reply"
        title="Cancel reply"
      >×</button>
    </div>

    <form class="message-composer">
      <button type="button" class="composer-button" id="attach-file-button" aria-label="Attach file" title="Attach file">＋</button>
      <button type="button" class="composer-button voice-note-button" id="voice-note-button" aria-label="Voice note" title="Voice note">🎙️</button>
      <input type="text" placeholder="Write a message..." aria-label="Message">
      <button
        type="button"
        class="composer-button"
        id="emoji-button"
        aria-label="Emoji"
        title="Emoji"
      >😊</button>

      <div
        class="emoji-picker"
        id="emoji-picker"
        hidden
        aria-label="Emoji picker"
      >
        <div class="emoji-picker-tabs" role="tablist" aria-label="Emoji categories">
          <button type="button" class="emoji-tab active" data-category="smileys" title="Smileys">😀</button>
          <button type="button" class="emoji-tab" data-category="people" title="People">👋</button>
          <button type="button" class="emoji-tab" data-category="animals" title="Animals">🐶</button>
          <button type="button" class="emoji-tab" data-category="food" title="Food">🍕</button>
          <button type="button" class="emoji-tab" data-category="activities" title="Activities">⚽</button>
          <button type="button" class="emoji-tab" data-category="travel" title="Travel">🚗</button>
          <button type="button" class="emoji-tab" data-category="objects" title="Objects">💡</button>
          <button type="button" class="emoji-tab" data-category="symbols" title="Symbols">❤️</button>
        </div>

        <div
          class="emoji-grid"
          id="emoji-grid"
          role="grid"
          aria-label="Available emojis"
        ></div>
      </div>
      <button
        type="submit"
        class="send-button"
        id="send-message-button"
        aria-label="Send message"
        title="Send message"
      >➤</button>
    </form>


    <!-- New Chat contact picker removed: Contacts is the source of truth. -->
    <div class="new-chat-picker" id="new-chat-picker" hidden aria-hidden="true">
      <div class="new-chat-backdrop" data-new-chat-close></div>

      <section class="new-chat-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="new-chat-title">

        <header class="new-chat-header">
          <div>
            <span class="new-chat-eyebrow">ZAKICHAT</span>
            <h2 id="new-chat-title">New Chat</h2>
            <p>Choose a contact to start chatting.</p>
          </div>

          <button
            type="button"
            class="new-chat-close"
            data-new-chat-close
            aria-label="Close"
          >×</button>
        </header>

        <label class="new-chat-search">
          <span aria-hidden="true">⌕</span>
          <input
            id="new-chat-search"
            type="search"
            placeholder="Search contacts"
            autocomplete="off"
          >
        </label>

        <div class="new-chat-list" id="new-chat-list">
          <div class="new-chat-loading">
            Loading contacts...
          </div>
        </div>
      </section>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../static/js/appearance.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/account-manager.js"></script>
<script src="../static/js/supabase-client.js"></script>
<script src="../static/js/service-worker.js"></script>
<script src="../static/js/auth-guard.js"></script>
<script src="../static/js/realtime.js"></script>
<script src="../static/js/media.js"></script>
<script src="../static/js/messages.js"></script>
<script src="../static/js/reactions.js"></script>
<script src="../static/js/reaction-picker.js"></script>
<script src="../static/js/typing.js"></script>
<script src="../static/js/forward.js"></script>
<script src="../static/js/zaki-ringtones.js"></script>
<script src="../static/js/communication.js"></script>
<script src="../static/js/zaki-keyboard.js"></script>
<script src="../static/js/chat.js"></script>
<script src="../static/js/nav-profile-sync.js"></script>
<script src="../static/js/emoji-picker.js"></script>
<script src="../static/js/chat-search.js"></script>
<script src="../static/js/chat-more-menu.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.ZakiKeyboard) window.ZakiKeyboard.init();
});
</script>

</body>
</html>
