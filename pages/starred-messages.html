<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starred Messages | ZakiChat</title>
  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
  <link rel="stylesheet" href="../static/css/starred-messages.css">
</head>

<body class="starred-messages-page">
  <main class="starred-shell">

    <header class="starred-header">
      <a
        href="javascript:history.back()"
        class="starred-back"
        aria-label="Back"
      >←</a>

      <div>
        <span class="starred-eyebrow">CHAT COLLECTION</span>
        <h1>Starred Messages</h1>
      </div>
    </header>

    <section class="starred-context">
      <div class="starred-star">★</div>
      <div>
        <strong>Saved for later</strong>
        <small>Messages you marked as important</small>
      </div>
    </section>

    <section id="starredMessagesList"></section>

    <p id="starredMessagesEmpty" hidden>
      You have no starred messages yet.
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/starred-messages.js"></script>
</body>
</html>
