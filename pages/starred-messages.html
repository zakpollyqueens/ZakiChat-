<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starred Messages | ZakiChat</title>
  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
</head>

<body class="starred-messages-page">
  <main style="width:min(100% - 24px,760px);margin:auto;padding:20px 0 40px;">
    <header style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
      <a
        href="javascript:history.back()"
        aria-label="Back"
        style="width:42px;height:42px;display:grid;place-items:center;border-radius:50%;text-decoration:none;font-size:28px;color:inherit;background:rgba(127,127,127,.10);"
      >‹</a>

      <div>
        <p style="margin:0 0 4px;font-size:11px;letter-spacing:.12em;opacity:.55;">
          ZAKICHAT
        </p>
        <h1 style="margin:0;font-size:25px;">Starred Messages</h1>
      </div>
    </header>

    <section
      id="starredMessagesList"
      style="display:flex;flex-direction:column;gap:10px;"
    ></section>

    <p
      id="starredMessagesEmpty"
      hidden
      style="padding:40px 18px;text-align:center;opacity:.6;"
    >
      You have no starred messages yet.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/starred-messages.js"></script>
</body>
</html>
