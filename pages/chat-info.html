<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#08131d">
  <title>Contact Info | ZakiChat</title>

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/chat-info.css">
</head>

<body class="chat-info-page">

  <main class="chat-info-shell">

    <header class="chat-info-header">
      <a
        href="javascript:history.back()"
        class="chat-info-back"
        aria-label="Go back"
      >←</a>

      <div class="chat-info-heading">
        <span>CONTACT</span>
        <h1>Info</h1>
      </div>
    </header>

    <section class="contact-hero">

      <div class="contact-avatar" id="contactAvatar">
        <span id="contactInitials">?</span>
      </div>

      <h2 id="contactName">Loading...</h2>
      <p id="contactUsername">@username</p>

      <div class="contact-presence" id="contactPresence">
        <i></i>
        <span>Offline</span>
      </div>

      <div class="contact-actions">
        <a id="infoMessageButton" href="#" class="contact-action">
          <strong>💬</strong>
          <span>Message</span>
        </a>

        <a id="infoCallButton" href="#" class="contact-action">
          <strong>📞</strong>
          <span>Call</span>
        </a>

        <a id="infoVideoButton" href="#" class="contact-action">
          <strong>▣</strong>
          <span>Video</span>
        </a>
      </div>

    </section>

    <section class="info-section">

      <div class="info-row">
        <div class="info-row-icon">☎</div>
        <div class="info-row-content">
          <span>Phone</span>
          <strong id="contactPhone">Not available</strong>
        </div>
      </div>

      <div class="info-row">
        <div class="info-row-icon">@</div>
        <div class="info-row-content">
          <span>Username</span>
          <strong id="contactHandle">@username</strong>
        </div>
      </div>

      <div class="info-row">
        <div class="info-row-icon">⌖</div>
        <div class="info-row-content">
          <span>Location</span>
          <strong id="contactLocation">Not available</strong>
        </div>
      </div>

    </section>

    <section class="info-card" id="aboutCard">
      <span class="card-label">ABOUT</span>
      <p id="contactBio">
        No bio available.
      </p>
    </section>

    <section class="chat-tools">

      <button type="button" data-info-page="media">
        <span class="tool-icon">▣</span>
        <span>
          <strong>Media, Links & Docs</strong>
          <small>Photos, videos, files and links</small>
        </span>
        <b>›</b>
      </button>

      <button type="button" data-info-page="notifications">
        <span class="tool-icon">◉</span>
        <span>
          <strong>Notifications</strong>
          <small>Customize chat notifications</small>
        </span>
        <b>›</b>
      </button>

      <button type="button" data-info-page="disappearing">
        <span class="tool-icon">◌</span>
        <span>
          <strong>Disappearing Messages</strong>
          <small>Automatically remove messages</small>
        </span>
        <b>›</b>
      </button>

      <button type="button" data-info-page="theme">
        <span class="tool-icon">✦</span>
        <span>
          <strong>Wallpaper & Theme</strong>
          <small>Customize this conversation</small>
        </span>
        <b>›</b>
      </button>

      <button type="button" data-info-page="starred">
        <span class="tool-icon">★</span>
        <span>
          <strong>Starred Messages</strong>
          <small>Messages saved for later</small>
        </span>
        <b>›</b>
      </button>

    </section>

    <section class="danger-section">

      <button type="button" id="blockContactButton">
        <span>⊘</span>
        Block Contact
      </button>

      <button type="button" id="reportContactButton">
        <span>⚑</span>
        Report Contact
      </button>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/chat-info.js"></script>

</body>
</html>
