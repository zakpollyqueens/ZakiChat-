<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Contacts | ZakiChat</title>
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/contacts.css">

</head>

<body>
<main class="contacts-page">
  <section class="contacts-shell">

    <header class="contacts-head">
      <div class="contacts-title">
        <img src="../static/images/icon.jpg" alt="ZakiChat">
        <div>
          <h1>Contacts</h1>
          <p>Find and connect with people on ZakiChat.</p>
        </div>
      </div>

      <button class="add-contact-btn" id="openAddContact" type="button">
        <span>＋</span>
        <span class="label">Add Contact</span>
      </button>
    </header>

    <div class="contact-search">
      <span>⌕</span>
      <input id="contactSearch" type="search" placeholder="Search contacts, phone or email">
    </div>

    <section id="contactList">
      <div class="contact-card">
        <div class="contact-avatar">ZM</div>
        <div class="contact-info">
          <strong>Zakmolanitech Solutions</strong>
          <span>+256 742 956 448</span>
        </div>
        <div class="contact-actions">
          <button class="contact-action primary" type="button">Chat</button>
        </div>
      </div>

      <div class="empty-contacts" id="emptyContacts" style="display:none">
        <strong>No contacts found</strong>
        Try another name, phone number or email.
      </div>
    </section>

  </section>
</main>

<div class="modal-backdrop" id="contactModal" aria-hidden="true">
  <section class="add-modal" role="dialog" aria-modal="true" aria-labelledby="addContactTitle">
    <button class="modal-close" id="closeAddContact" type="button" aria-label="Close">×</button>

    <h2 id="addContactTitle">Add a new contact</h2>
    <p>Save someone using their international phone number or their ZakiChat email.</p>

    <form class="contact-form" id="addContactForm">

      <label class="form-label">
        Country
        <div class="country-row">
          <select class="country-select" id="countryCode">
            <option value="+256">🇺🇬 Uganda (+256)</option>
            <option value="+254">🇰🇪 Kenya (+254)</option>
            <option value="+255">🇹🇿 Tanzania (+255)</option>
            <option value="+250">🇷🇼 Rwanda (+250)</option>
            <option value="+1">🇺🇸 United States (+1)</option>
            <option value="+44">🇬🇧 United Kingdom (+44)</option>
            <option value="+27">🇿🇦 South Africa (+27)</option>
            <option value="+91">🇮🇳 India (+91)</option>
            <option value="+86">🇨🇳 China (+86)</option>
            <option value="+971">🇦🇪 UAE (+971)</option>
          </select>

          <input class="contact-input" id="phoneNumber" type="tel"
                 inputmode="tel" autocomplete="tel"
                 placeholder="Phone number">
        </div>
      </label>

      <div class="or-divider"><span>OR</span></div>

      <label class="form-label">
        ZakiChat email
        <input class="contact-input" id="contactEmail" type="email"
               autocomplete="email" placeholder="friend@example.com">
      </label>

      <label class="form-label">
        Contact name
        <input class="contact-input" id="contactName" type="text"
               autocomplete="name" placeholder="Friend's name">
      </label>

      <div class="form-message" id="formMessage"></div>

      <button class="save-contact" type="submit">＋ Save Contact</button>
    </form>
  </section>
</div>


<script src="../static/js/contacts.js"></script>
</body>
</html>
