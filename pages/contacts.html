<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07172b">
<title>Contacts · Molan Chat</title>
<link rel="stylesheet" href="../static/css/main.css"><link rel="stylesheet" href="../static/css/telegram-chat.css"><link rel="stylesheet" href="../static/css/telegram-chat-list.css"><link rel="stylesheet" href="../static/css/signature-theme.css">
<style>
body.zc-contacts-page{--contacts-bg:#071426;--contacts-panel:#0d2037;--contacts-line:rgba(111,203,232,.13);--contacts-text:#e8f8ff;--contacts-muted:#8da9bd;--contacts-cyan:#45ddff;background:var(--contacts-bg)!important;color:var(--contacts-text)!important}
body.zc-contacts-page .tg-shell{background:var(--contacts-bg)!important}
.zc-contacts-head{flex:none;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,#0b1e34,#071426)}
.zc-contacts-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.zc-contacts-top h1{margin:0;color:var(--contacts-text);font-size:23px;font-weight:760;letter-spacing:-.45px}
.zc-contact-actions{display:flex;gap:8px;align-items:center}
.zc-action{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--contacts-line);border-radius:50%;background:#102a43;color:var(--contacts-cyan)}
.zc-action svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.zc-contacts-search{display:flex;align-items:center;gap:10px;height:43px;margin:12px 0 9px;padding:0 13px;border:1px solid var(--contacts-line);border-radius:14px;background:var(--contacts-panel);color:var(--contacts-muted)}
.zc-contacts-search svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.zc-contacts-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--contacts-text);font-size:14px}
.zc-contacts-search input::placeholder{color:#7894aa}
.zc-contact-shortcuts{display:flex;gap:10px;padding:7px 0 12px;border-bottom:1px solid var(--contacts-line)}
.zc-shortcut{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:7px 4px;border:0;background:transparent;color:var(--contacts-text);text-align:left;font-size:13px;font-weight:650}
.zc-shortcut-icon{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:13px;background:linear-gradient(145deg,#123e61,#142957);color:var(--contacts-cyan)}
.zc-shortcut-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zc-contact-results{flex:1;min-height:0;overflow:auto;padding:0 0 calc(76px + env(safe-area-inset-bottom));scrollbar-width:none}
.zc-contact-results::-webkit-scrollbar{display:none}
.zc-section-label{margin:0;padding:15px 16px 7px;color:var(--contacts-muted);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.zc-person{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 16px;border:0;background:transparent;color:var(--contacts-text);text-align:left}
.zc-person:active{background:#ffffff08}
.zc-person-avatar{display:grid;place-items:center;width:49px;height:49px;flex:none;overflow:hidden;border:1px solid #54c9f52c;border-radius:50%;background:linear-gradient(145deg,#13516a,#29275c);color:#e8fbff;font-size:16px;font-weight:750}
.zc-person-avatar img{width:100%;height:100%;object-fit:cover}
.zc-person-copy{display:flex;flex:1;min-width:0;align-self:stretch;flex-direction:column;justify-content:center;gap:4px;border-bottom:1px solid var(--contacts-line)}
.zc-person-copy strong{overflow:hidden;color:var(--contacts-text);font-size:15px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}
.zc-person-copy small{overflow:hidden;color:var(--contacts-muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.zc-contact-empty{padding:30px 22px;text-align:center;color:var(--contacts-muted);font-size:14px;line-height:1.55}
.zc-contact-dialog{width:min(92vw,430px);max-height:88dvh;padding:0;overflow:auto;border:1px solid #254761;border-radius:22px;background:linear-gradient(160deg,#102741,#071426 80%);color:var(--contacts-text);box-shadow:0 22px 70px #0009}
.zc-contact-dialog::backdrop{background:#020a14b8;backdrop-filter:blur(5px)}
.zc-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px}
.zc-dialog-head h2{margin:0;color:var(--contacts-text);font-size:20px}
.zc-dialog-head p{margin:5px 0 0;color:var(--contacts-muted);font-size:12px}
.zc-dialog-close{width:34px;height:34px;border:1px solid var(--contacts-line);border-radius:50%;background:#122d47;color:var(--contacts-text);font-size:21px}
.zc-contact-form{display:grid;gap:13px;padding:7px 18px 19px}
.zc-form-field{display:grid;gap:7px;color:#b8d2e3;font-size:12px;font-weight:700}
.zc-form-field input,.zc-form-field select{box-sizing:border-box;width:100%;min-height:45px;padding:0 12px;border:1px solid #254761;border-radius:12px;outline:none;background:#091a2d;color:var(--contacts-text);font:inherit;font-size:14px}
.zc-form-field input:focus,.zc-form-field select:focus{border-color:var(--contacts-cyan);box-shadow:0 0 0 3px #45ddff1b}
.zc-phone-row{display:grid;grid-template-columns:125px minmax(0,1fr);gap:9px}
.zc-lookup-state{min-height:22px;color:var(--contacts-muted);font-size:12px;line-height:1.5}
.zc-lookup-state.is-found{color:#75f1bf}.zc-lookup-state.is-error{color:#ffb0a6}
.zc-save-contact{min-height:46px;border:0;border-radius:13px;background:linear-gradient(110deg,#39dfff,#1596df 60%,#3c75e8);color:#03172a;font-size:14px;font-weight:800}
.zc-save-contact:disabled{opacity:.45}
@media(max-width:360px){.zc-phone-row{grid-template-columns:112px minmax(0,1fr)}.zc-shortcut{font-size:12px}}

/* Glassy, lively contacts refresh */
body.zc-contacts-page,body.zc-contacts-page .tg-shell{background:radial-gradient(ellipse at 12% 0%,rgba(0,214,255,.16),transparent 35%),radial-gradient(ellipse at 100% 38%,rgba(92,90,255,.12),transparent 35%),#061322!important;color:#eaf9ff!important}
body.zc-contacts-page .tg-shell{isolation:isolate}
.zc-contacts-head{position:relative;padding:calc(18px + env(safe-area-inset-top)) 17px 12px;background:linear-gradient(145deg,rgba(13,42,66,.93),rgba(7,20,38,.84));border-bottom:1px solid rgba(118,226,255,.14);box-shadow:0 16px 36px rgba(0,0,0,.18);backdrop-filter:blur(22px)}
.zc-contacts-top{align-items:center;min-height:60px}
.zc-contact-heading{min-width:0}.zc-contact-brandline{display:flex;align-items:center;gap:9px;margin-bottom:5px}.zc-brand-icon-small{width:34px;height:34px;object-fit:cover;border-radius:11px;border:1px solid #72eaff50;box-shadow:0 5px 15px #00b9ef22}.zc-contact-heading .zc-contacts-eyebrow{margin:0}
.zc-contacts-eyebrow{display:block;margin-bottom:3px;color:#5de3ff;font-size:10px;font-weight:850;letter-spacing:2px}
.zc-contacts-top h1{display:flex;align-items:center;gap:10px;font-size:32px;line-height:1.08;letter-spacing:-1px;background:linear-gradient(100deg,#fff,#9ceaff 65%,#80aaff);-webkit-background-clip:text;background-clip:text;color:transparent}
.zc-contact-heading p{margin:8px 0 0;color:#9bb7cb;font-size:13px;line-height:1.5}
.zc-action{width:43px;height:43px;border-color:rgba(106,223,255,.25);border-radius:15px;background:linear-gradient(145deg,rgba(28,75,103,.8),rgba(12,32,53,.85));box-shadow:inset 0 1px 0 #ffffff12,0 7px 20px #0002;transition:transform .2s,box-shadow .2s}
.zc-action:active{transform:scale(.94)}
.zc-contacts-search{height:54px;margin:19px 0 12px;padding:0 16px;border-color:rgba(105,220,255,.2);border-radius:17px;background:rgba(9,28,47,.75);box-shadow:inset 0 1px 0 #ffffff08,0 8px 25px #0002;backdrop-filter:blur(14px)}
.zc-contacts-search:focus-within{border-color:#42dfff8a;box-shadow:0 0 0 3px #45ddff12,0 8px 25px #0002}
.zc-contacts-search input{color:#eaf9ff}
.zc-contact-shortcuts{padding:9px 0 13px;border-bottom-color:rgba(105,220,255,.12)}
.zc-shortcut{gap:12px;padding:9px 8px;border:1px solid rgba(106,223,255,.12);border-radius:17px;background:linear-gradient(115deg,rgba(17,52,78,.7),rgba(17,30,61,.5));box-shadow:inset 0 1px 0 #ffffff08;transition:transform .2s,border-color .2s}
.zc-shortcut:active{transform:scale(.985);border-color:#45ddff66}
.zc-shortcut-icon{width:43px;height:43px;border:1px solid #5be6ff35;border-radius:15px;background:linear-gradient(145deg,#22bfe3,#3459bd);color:white;box-shadow:0 6px 18px #00b9ef22}
.zc-shortcut>span:last-child{display:flex;flex-direction:column;gap:2px}
.zc-shortcut strong{font-size:13px;color:#eaf9ff}
.zc-shortcut small{font-size:11px;font-weight:450;color:#8eacc2}
.zc-contact-results{padding:8px 12px calc(126px + env(safe-area-inset-bottom));overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#24506b transparent}
.zc-section-label{padding:17px 7px 9px;color:#79a9c2;font-size:10px;letter-spacing:1.6px}
.zc-person{position:relative;gap:14px;min-height:82px;margin:6px 0;padding:11px 12px;border:1px solid rgba(104,219,255,.11);border-radius:20px;background:linear-gradient(115deg,rgba(16,43,66,.78),rgba(10,26,46,.56));box-shadow:inset 0 1px 0 #ffffff06,0 8px 22px #0001;text-align:left;transition:transform .18s,border-color .18s,background .18s;animation:zc-contact-in .35s both}
.zc-person:active{transform:scale(.985);border-color:#45ddff40;background:rgba(17,54,78,.82)}
.zc-person-avatar{width:55px;height:55px;border-color:#58dcff50;background:linear-gradient(145deg,#24bcd9,#4753c8 75%);box-shadow:0 5px 15px #0002}
.zc-person-copy{border-bottom:0;gap:5px}
.zc-person-copy strong{font-size:15px;color:#f0faff;font-weight:750}
.zc-person-copy small{color:#9ab6c9;font-size:12px}
.zc-contact-empty{margin:22px 2px;padding:28px 20px;border:1px solid rgba(105,220,255,.14);border-radius:22px;background:rgba(13,37,59,.6);color:#9db9cc;line-height:1.75;backdrop-filter:blur(14px)}
.zc-add-contact-fab{position:fixed;z-index:12;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;min-height:54px;padding:0 18px;border:1px solid rgba(255,255,255,.35);border-radius:19px;background:linear-gradient(120deg,#61eaff,#20bde9 48%,#387de9);color:#04182a;font-size:13px;font-weight:850;box-shadow:0 10px 30px #00bde944,inset 0 1px 0 #ffffffb3;transition:transform .2s,box-shadow .2s;animation:zc-fab-float 3s ease-in-out infinite}
.zc-add-contact-fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.zc-add-contact-fab:active{transform:scale(.94);box-shadow:0 5px 14px #00bde933}
@keyframes zc-contact-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes zc-fab-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media(min-width:650px){.zc-contacts-head,.zc-contact-results{padding-left:max(18px,calc((100vw - 620px)/2));padding-right:max(18px,calc((100vw - 620px)/2))}.zc-add-contact-fab{right:max(22px,calc((100vw - 620px)/2))}}
@media(prefers-reduced-motion:reduce){.zc-person,.zc-add-contact-fab{animation:none;transition:none}}

 .zc-contacts-count{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 7px;box-sizing:border-box;border:1px solid #57ddff45;border-radius:999px;background:#1b8bbd2b;color:#8deaff;font-size:12px;font-weight:850;letter-spacing:0;vertical-align:middle}.zc-contacts-count:empty{display:none}
body.zc-contacts-page .zc-person.is-selected{border-color:#54e3ff!important;background:linear-gradient(115deg,#124765,#102b49)!important;box-shadow:0 0 0 2px #54e3ff20,0 10px 24px #0003!important}.zc-contact-check{display:grid;place-items:center;flex:none;width:25px;height:25px;border:1px solid #54dfff80;border-radius:50%;background:#08243a;color:#fff;font-weight:900}.zc-person.is-selected .zc-contact-check{background:linear-gradient(135deg,#38dfff,#168fdc);color:#03172a}.zc-contact-actions [hidden]{display:none!important}
</style>
</head>

<script>
(function(){
 const $=s=>document.querySelector(s);let client=null,user=null,people=[],foundProfile=null,lookupTimer=0,lookupSequence=0,selectMode=false;const selectedContacts=new Set();
 const toast=m=>{const t=$("#tg-toast");t.textContent=m;t.classList.add("is-visible");setTimeout(()=>t.classList.remove("is-visible"),2500)};
 const params=new URLSearchParams(location.search),requestedContact=String(params.get("molanoContact")||params.get("search")||"").trim();
 if(requestedContact){$("#contacts-search-box").hidden=false;$("#contacts-search").value=requestedContact;}
 const label=p=>p.display_name||p.profile?.full_name||p.profile?.username||p.profile?.phone||"Molan Chat contact";
 const profileOf=row=>row.profiles||row.profile||null;
 const initials=s=>(String(s||"Z").trim().split(/\s+/).map(v=>v[0]).join("").slice(0,2)||"Z").toUpperCase();
 function render(){const root=$("#contacts-results"),q=$("#contacts-search").value.trim().toLowerCase();root.replaceChildren();const count=$("#contacts-count");if(count)count.textContent=String(people.length);const caption=$("#contacts-count-caption");if(caption)caption.textContent=people.length===1?"1 saved contact":" "+people.length+" saved contacts";const rows=people.filter(row=>{const p=profileOf(row)||{};return [label(row),p.username,p.phone].some(v=>String(v||"").toLowerCase().includes(q))});$("#contacts-select-toggle").textContent=selectMode?"Cancel":"Select";$("#contacts-delete-selected").hidden=!selectMode;$("#contacts-delete-selected").textContent=selectedContacts.size?"Delete ("+selectedContacts.size+")":"Delete";$("#contacts-delete-selected").disabled=!selectedContacts.size;if(!rows.length){const e=document.createElement("p");e.className="zc-contact-empty";e.textContent=q?"No saved contacts match that search.":"Your circle starts here. Add someone by phone number and start a conversation that matters.";root.append(e);return}for(const row of rows){const p=profileOf(row);if(!p)continue;const b=document.createElement("button");b.type="button";b.className="zc-person"+(selectedContacts.has(row.contact_user_id)?" is-selected":"");const av=document.createElement("span");av.className="zc-person-avatar";if(p.avatar_url&&row.profilePhotoVisible!==false){const img=document.createElement("img");img.src=p.avatar_url;img.alt="";img.loading="lazy";av.append(img)}else av.textContent=initials(label(row));const copy=document.createElement("span");copy.className="zc-person-copy";const n=document.createElement("strong");n.textContent=label(row);const sub=document.createElement("small");sub.textContent=p.username?"@"+p.username:p.phone||"Molan Chat member";copy.append(n,sub);b.append(av,copy);if(selectMode){const check=document.createElement("span");check.className="zc-contact-check";check.textContent=selectedContacts.has(row.contact_user_id)?"✓":"";b.append(check)}b.addEventListener("click",()=>{if(selectMode){if(selectedContacts.has(row.contact_user_id))selectedContacts.delete(row.contact_user_id);else selectedContacts.add(row.contact_user_id);render();return}openContactDetails(row)});root.append(b)}}
 async function loadContacts(){const cacheKey="molan-chat-contacts-"+user.id;try{const {data:links,error:linksError}=await client.from("contacts").select("contact_user_id,display_name,created_at").eq("user_id",user.id).order("created_at",{ascending:false});if(linksError)throw linksError;const rows=links||[];if(!rows.length){people=[];localStorage.setItem(cacheKey,"[]");render();return}const ids=[...new Set(rows.map(row=>row.contact_user_id).filter(Boolean))];const {data:profiles,error:profilesError}=await client.from("profiles").select("id,username,full_name,phone,avatar_url,is_online").in("id",ids);if(profilesError)throw profilesError;const byId=new Map((profiles||[]).map(profile=>[profile.id,profile]));people=rows.filter(row=>byId.has(row.contact_user_id)).map(row=>({...row,profile:byId.get(row.contact_user_id),profileVisible:true,profilePhotoVisible:true,aboutVisible:true}));await Promise.all(people.map(async row=>{try{const {data,error}=await client.rpc("get_profile_visibility",{p_profile_owner_id:row.contact_user_id});if(error)throw error;const visibility=Array.isArray(data)?data[0]:data;if(visibility){row.profileVisible=visibility.profile_visible!==false;row.profilePhotoVisible=visibility.profile_photo_visible!==false;row.aboutVisible=visibility.about_visible!==false}}catch(privacyError){console.debug("Profile visibility lookup failed",privacyError);row.profileVisible=false;row.profilePhotoVisible=false;row.aboutVisible=false}}));try{localStorage.setItem(cacheKey,JSON.stringify(people))}catch(cacheError){console.debug("Contacts local cache unavailable",cacheError)}render()}catch(error){let cached=[];try{cached=JSON.parse(localStorage.getItem(cacheKey)||"[]")}catch(_){}if(!cached.length&&navigator.onLine)throw error;people=Array.isArray(cached)?cached:[];render();if(people.length)toast("Offline mode · showing saved contacts");else throw error}}
 let activeDetailContact=null;
 async function openContactDetails(row){activeDetailContact=row;$("#contact-detail-profile").hidden=false;$("#contact-detail-edit").hidden=false;$("#contact-detail-share").hidden=false;const p=profileOf(row)||{};const title=label(row);$("#contact-details-title").textContent=title;$("#contact-details-subtitle").textContent=p.phone||p.username||"Molan Chat contact";const avatar=$("#contact-details-profile");avatar.replaceChildren();const pic=document.createElement("span");pic.className="zc-person-avatar";if(p.avatar_url){const img=document.createElement("img");img.src=p.avatar_url;img.alt="";pic.append(img)}else pic.textContent=initials(title);const copy=document.createElement("span");copy.style.cssText="display:flex;flex-direction:column;gap:5px;min-width:0";const strong=document.createElement("strong");strong.textContent=title;const small=document.createElement("small");small.style.color="#8da9bd";small.textContent=p.username?"@"+p.username:(p.phone||"Molan Chat member");copy.append(strong,small);avatar.append(pic,copy);let visibility=null;try{const {data,error}=await client.rpc("get_profile_visibility",{p_profile_owner_id:p.id});if(error)throw error;visibility=Array.isArray(data)?data[0]:data}catch(e){console.debug("Contact profile visibility could not be checked",e)}const secret=visibility?visibility.profile_visible===false:(activeDetailContact.profileVisible===false);if(p.avatar_url&&(visibility?.profile_photo_visible===false||activeDetailContact.profilePhotoVisible===false)){const image=avatar.querySelector("img");if(image)image.remove();pic.textContent=initials(title)}$("#contact-details-status").textContent=secret?"This person has hidden their profile. You can still message or share their saved contact.":(navigator.onLine?"Contact details are available.":"Offline · showing saved details.");$("#contact-detail-profile").hidden=secret;$("#contact-detail-profile").textContent=secret?"Profile hidden":"View profile";$("#contact-details-dialog").showModal()}
 $("#close-contact-details").addEventListener("click",()=>$("#contact-details-dialog").close());
 $("#contact-detail-message").addEventListener("click",async()=>{if(!activeDetailContact)return;if(!navigator.onLine){toast("Connect to the internet to open a conversation.");return}try{const p=profileOf(activeDetailContact);const {data,error}=await client.rpc("create_or_get_direct_conversation",{p_other_user_id:p.id});if(error)throw error;const id=typeof data==="string"?data:data?.id||data?.conversation_id;if(!id)throw new Error("The conversation was not returned.");const draftKey="molano-pending-message-draft:"+user.id;let draft="";try{const raw=localStorage.getItem(draftKey)||"";if(raw){localStorage.removeItem(draftKey);const pending=JSON.parse(raw);const expected=String(pending.name||"").trim().toLowerCase(),actual=String(label(activeDetailContact)||"").trim().toLowerCase();if(pending.draft&&expected&&actual&&(actual.includes(expected)||expected.includes(actual)))draft=String(pending.draft).slice(0,4000);else if(pending.draft)toast("Draft kept private: the selected contact did not match the intended recipient.")}}catch(_){}location.href="chat.html?id="+encodeURIComponent(id)+(draft?"&draft="+encodeURIComponent(draft):"")}catch(e){toast(e.message||"Could not open the conversation.")}});
 $("#contact-detail-profile").addEventListener("click",()=>{if(!activeDetailContact)return;const p=profileOf(activeDetailContact);const d=$("#contact-details-dialog");d.close();const title=label(activeDetailContact);const avatar=$("#contact-details-profile");avatar.replaceChildren();const box=document.createElement("div");box.style.cssText="display:grid;place-items:center;text-align:center;padding:10px 0 18px;width:100%";const img=document.createElement("span");img.className="zc-person-avatar";img.style.cssText="width:88px;height:88px;font-size:26px;margin-bottom:12px";if(p.avatar_url){const image=document.createElement("img");image.src=p.avatar_url;image.alt=title+" profile photo";img.replaceChildren(image)}else img.textContent=initials(title);const name=document.createElement("strong");name.textContent=title;const info=document.createElement("p");info.style.color="#8da9bd";info.textContent=[p.username?"@"+p.username:"",p.phone||""].filter(Boolean).join(" · ")||"Molan Chat member";box.append(img,name,info);avatar.append(box);$("#contact-details-title").textContent="Contact profile";$("#contact-details-subtitle").textContent="Public profile information";$("#contact-details-status").textContent="";$("#contact-detail-profile").hidden=true;$("#contact-detail-edit").hidden=true;$("#contact-detail-share").hidden=true;$("#contact-details-dialog").showModal();});
 $("#contact-detail-edit").addEventListener("click",async()=>{if(!activeDetailContact)return;const current=label(activeDetailContact);const next=prompt("Edit contact name",current);if(next===null)return;const name=next.trim();if(!name){toast("Enter a contact name.");return}if(!navigator.onLine){toast("Connect to the internet to save contact changes.");return}try{const {error}=await client.from("contacts").update({display_name:name}).eq("user_id",user.id).eq("contact_user_id",activeDetailContact.contact_user_id);if(error)throw error;activeDetailContact.display_name=name;await loadContacts();$("#contact-details-dialog").close();toast("Contact updated")}catch(e){toast(e.message||"Could not update contact.")}});
 $("#contact-detail-share").addEventListener("click",async()=>{if(!activeDetailContact)return;const p=profileOf(activeDetailContact);const text="Molan Chat contact: "+label(activeDetailContact)+(p.phone?"\nPhone: "+p.phone:"")+(p.username?"\nUsername: @"+p.username:"");try{if(window.ZakiChatNative?.shareText)window.ZakiChatNative.shareText(text);else if(navigator.share)await navigator.share({title:"Molan Chat contact",text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);toast("Contact details copied to clipboard")}else toast(text)}catch(e){if(e.name!=="AbortError")toast("Could not share this contact.")}});
 function setLookup(message,kind=""){const el=$("#contact-lookup-state");el.textContent=message;el.className="zc-lookup-state"+(kind?" is-"+kind:"")}
 function normalizedPhone(){let digits=$("#contact-phone").value.replace(/\D/g,"");digits=digits.replace(/^0+/,"");return digits?$("#contact-country-code").value+digits:""}
 async function lookupNumber(){const seq=++lookupSequence;foundProfile=null;$("#save-contact-button").disabled=true;const digits=$("#contact-phone").value.replace(/\D/g,"").replace(/^0+/,"");if(digits.length<6){setLookup("Enter the phone number to check Molan Chat registration.");return}const full=normalizedPhone();setLookup("Checking whether this number is registered…");try{let result=await client.from("profiles").select("id,username,full_name,phone,avatar_url").eq("phone",full).neq("id",user.id).maybeSingle();if(result.error)throw result.error;if(!result.data){result=await client.from("profiles").select("id,username,full_name,phone,avatar_url").eq("phone",full.replace(/\D/g,"")).neq("id",user.id).maybeSingle();if(result.error)throw result.error}if(seq!==lookupSequence)return;if(!result.data){setLookup("No Molan Chat account found for "+full+". Check the country code and number, then try again.","error");return}foundProfile=result.data;setLookup("Registered on Molan Chat: "+(result.data.full_name||result.data.username||full)+". You can save this contact.","found");$("#save-contact-button").disabled=false}catch(e){if(seq!==lookupSequence)return;console.error("Contact lookup failed",e);setLookup("Could not check this number right now. Please try again.","error")}}
 function scheduleLookup(){clearTimeout(lookupTimer);foundProfile=null;$("#save-contact-button").disabled=true;setLookup("Checking the number as you type…");lookupTimer=setTimeout(lookupNumber,450)}

 $("#contacts-search").addEventListener("input",render);$("#contacts-select-toggle").addEventListener("click",()=>{selectMode=!selectMode;selectedContacts.clear();render()});$("#contacts-delete-selected").addEventListener("click",async()=>{if(!selectedContacts.size)return;if(!confirm("Remove "+selectedContacts.size+" selected contact(s) from your contacts? Their Molan Chat accounts and conversations will not be deleted."))return;const ids=[...selectedContacts];try{const {error}=await client.from("contacts").delete().eq("user_id",user.id).in("contact_user_id",ids);if(error)throw error;people=people.filter(p=>!selectedContacts.has(p.contact_user_id));selectedContacts.clear();selectMode=false;render();toast("Selected contacts removed.")}catch(e){console.error(e);toast(e.message||"Could not remove selected contacts.")}});$("#contacts-search-toggle").addEventListener("click",()=>{$("#contacts-search-box").hidden=!$("#contacts-search-box").hidden;if(!$("#contacts-search-box").hidden)$("#contacts-search").focus()});

 $("#invite-contact").addEventListener("click",async()=>{const text="Join me on Molan Chat and let’s chat! Download the official app: https://zakpollyqueens.github.io/ZakiChat-/download.html";try{if(window.ZakiChatNative?.shareText){window.ZakiChatNative.shareText(text);return}if(navigator.share){await navigator.share({title:"Join me on Molan Chat",text,url:"https://zakpollyqueens.github.io/ZakiChat-/download.html"});return}if(navigator.clipboard){await navigator.clipboard.writeText(text);toast("Invitation copied. Paste it into any messaging app.")}else toast("Share is unavailable on this device.")}catch(e){if(e.name!=="AbortError")toast("Could not open sharing options.")}});
 $("#add-contact-form").addEventListener("submit",async e=>{e.preventDefault();if(!foundProfile){await lookupNumber();if(!foundProfile)return}const name=$("#contact-display-name").value.trim();if(!name){$("#contact-display-name").focus();return}const button=$("#save-contact-button");button.disabled=true;button.textContent="Saving…";try{const {error}=await client.from("contacts").insert({user_id:user.id,contact_user_id:foundProfile.id,display_name:name});if(error){if(error.code==="23505")throw new Error("This person is already in your contacts.");throw error}await loadContacts();$("#add-contact-dialog").close();$("#add-contact-form").reset();foundProfile=null;setLookup("Enter a number to check whether it is registered on Molan Chat.");toast("Contact saved");}catch(err){console.error(err);toast(err.message||"Could not save contact.")}finally{button.textContent="Save contact";button.disabled=!foundProfile}});
