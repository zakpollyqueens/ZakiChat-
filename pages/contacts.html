<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17110f">
<title>Contacts · ZakiChat</title>
<link rel="stylesheet" href="../static/css/main.css"><link rel="stylesheet" href="../static/css/telegram-chat.css"><link rel="stylesheet" href="../static/css/telegram-chat-list.css">
<style>
body.zc-contacts-page .tg-shell{background:#17110f!important}
.zc-contacts-head{flex:none;padding:calc(10px + env(safe-area-inset-top)) 16px 9px;background:#17110f}
.zc-contacts-top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.zc-contacts-top h1{font-size:22px;line-height:1.2;margin:0;color:#f4c7a7;font-weight:750;letter-spacing:-.35px}
.zc-contact-actions{display:flex;gap:12px;align-items:center}
.zc-action{width:34px;height:34px;padding:5px;border:0;background:transparent;color:#f4c7a7;display:grid;place-items:center}
.zc-action svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.zc-contacts-search{height:40px;display:flex;align-items:center;gap:9px;padding:0 13px;margin:6px 0 9px;border-radius:10px;background:#25201e;color:#a08ba4}
.zc-contacts-search svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.zc-contacts-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f4c7a7;font-size:15px}
.zc-contacts-search input::placeholder{color:#a08ba4}
.zc-contact-shortcuts{display:flex;align-items:center;gap:0;padding:5px 0 10px;border-bottom:1px solid #2b2320}
.zc-shortcut{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:transparent;color:#f4c7a7;text-align:left;font-size:14px;padding:6px 3px}
.zc-shortcut-icon{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:#33265e;color:#f4c7a7}
.zc-shortcut-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zc-contact-results{flex:1;min-height:0;overflow:auto;padding:0 0 calc(70px + env(safe-area-inset-bottom));scrollbar-width:none}
.zc-contact-results::-webkit-scrollbar{display:none}
.zc-section-label{margin:0;padding:14px 16px 7px;color:#a08ba4;font-size:13px;font-weight:600}
.zc-person{display:flex;align-items:center;gap:12px;width:100%;min-height:67px;padding:7px 16px;border:0;background:transparent;color:#f4c7a7;text-align:left}
.zc-person:active{background:#ffffff0a}
.zc-person-avatar{width:49px;height:49px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#3b2b69;color:#f4c7a7;font-size:17px;font-weight:600}
.zc-person-avatar img{width:100%;height:100%;object-fit:cover}
.zc-person-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px;align-self:stretch;justify-content:center;border-bottom:1px solid #2a2220}
.zc-person-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f4c7a7;font-size:15px;font-weight:550}
.zc-person-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a08ba4;font-size:12px}
.zc-contact-empty{padding:28px 20px;text-align:center;color:#a08ba4;font-size:14px}
</style><link rel="stylesheet" href="../static/css/signature-theme.css">
</head>
<body class="tg-app tg-list-page zc-contacts-page"><main class="tg-shell">
<header class="zc-contacts-head"><div class="zc-contacts-top"><h1>Contacts</h1><div class="zc-contact-actions">
<button class="zc-action" id="contacts-search-toggle" type="button" aria-label="Search contacts"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg></button>
<button class="zc-action" id="contacts-menu-toggle" type="button" aria-label="More contact options"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg></button></div></div>
<label class="zc-contacts-search" id="contacts-search-box"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg><input id="contacts-search" type="search" placeholder="Search contacts" autocomplete="off"></label>
<div class="zc-contact-shortcuts"><button class="zc-shortcut" id="invite-contact" type="button"><span class="zc-shortcut-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v8m-4-4h8"/></svg></span><span>Invite Friends</span></button><button class="zc-shortcut" id="add-contact" type="button"><span class="zc-shortcut-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v8m-4-4h8"/></svg></span><span>Add Contact</span></button></div></header>
<section id="contacts-results" class="zc-contact-results" aria-label="Contacts"><p class="zc-contact-empty">Loading contacts…</p></section>
<nav class="zc-bottom-nav" aria-label="Main navigation">
  <a href="chats.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 3v-3H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><path d="M8 10h8M8 14h5"/></svg><span>Chats</span>
  </a>
  <a href="settings.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 13.8 1.1.9-1.6 2.8-1.4-.5a7.7 7.7 0 0 1-1.7 1l-.3 1.5h-3.2l-.3-1.5a7.7 7.7 0 0 1-1.7-1l-1.4.5-1.6-2.8 1.1-.9a7.2 7.2 0 0 1 0-2l-1.1-.9 1.6-2.8 1.4.5a7.7 7.7 0 0 1 1.7-1l.3-1.5h3.2l.3 1.5a7.7 7.7 0 0 1 1.7 1l1.4-.5 1.6 2.8-1.1.9a7.2 7.2 0 0 1 0 2Z"/></svg><span>Settings</span>
  </a>
  <a href="status.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></svg><span>Updates</span>
  </a>
</nav></main>
<div class="tg-toast" id="tg-toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/js/config.js"></script><script src="../static/js/account-manager.js"></script><script src="../static/js/supabase-client.js"></script><script src="../static/js/auth-guard.js"></script>
<script>
(function(){const $=s=>document.querySelector(s);let client=null,people=[];
const toast=m=>{const t=$("#tg-toast");t.textContent=m;t.classList.add("is-visible");setTimeout(()=>t.classList.remove("is-visible"),2400)};
const pname=p=>p.full_name||p.username||p.phone||"ZakiChat user";
function render(){const root=$("#contacts-results"),q=$("#contacts-search").value.trim().toLowerCase();root.replaceChildren();const rows=people.filter(p=>[p.full_name,p.username,p.phone].some(v=>String(v||"").toLowerCase().includes(q)));if(!rows.length){const e=document.createElement("p");e.className="zc-contact-empty";e.textContent=q?"No contacts found for this search.":"No other ZakiChat users yet.";root.append(e);return}const label=document.createElement("h2");label.className="zc-section-label";label.textContent="ZakiChat users · "+rows.length;root.append(label);for(const p of rows){const b=document.createElement("button");b.className="zc-person";b.type="button";const av=document.createElement("span");av.className="zc-person-avatar";if(p.avatar_url){const img=document.createElement("img");img.src=p.avatar_url;img.alt="";img.loading="lazy";av.append(img)}else av.textContent=(pname(p).trim().split(/\s+/).map(s=>s[0]).join("").slice(0,2)||"Z").toUpperCase();const copy=document.createElement("span");copy.className="zc-person-copy";const n=document.createElement("strong");n.textContent=pname(p);const sub=document.createElement("small");sub.textContent=p.username?"@"+p.username:p.phone||"ZakiChat member";copy.append(n,sub);b.append(av,copy);b.addEventListener("click",async()=>{b.disabled=true;try{const {data,error}=await client.rpc("create_or_get_direct_conversation",{p_other_user_id:p.id});if(error)throw error;if(!data)throw new Error("Conversation was not returned by the server.");location.href="chat.html?id="+encodeURIComponent(data)}catch(e){console.error(e);toast(e.message||"Could not open conversation.");b.disabled=false}});root.append(b)}}
async function init(){try{client=window.ZakiChatAuth?.client;if(!client)throw new Error("Chat services are not ready. Refresh and try again.");const {data:{user},error:a}=await client.auth.getUser();if(a)throw a;if(!user)throw new Error("Please sign in to see contacts.");const {data,error}=await client.from("profiles").select("id,username,full_name,phone,avatar_url,is_online").neq("id",user.id).order("full_name",{ascending:true}).limit(500);if(error)throw error;people=data||[];render()}catch(e){console.error("Contacts loading failed",e);$("#contacts-results").innerHTML="";const p=document.createElement("p");p.className="zc-contact-empty";p.textContent=e.message||"Could not load contacts.";$("#contacts-results").append(p)}}
$("#contacts-search").addEventListener("input",render);$("#contacts-search-toggle").addEventListener("click",()=>{$("#contacts-search-box").hidden=!$("#contacts-search-box").hidden;if(!$("#contacts-search-box").hidden)$("#contacts-search").focus()});
$("#contacts-menu-toggle").addEventListener("click",()=>toast("Contact options"));$("#invite-contact").addEventListener("click",()=>{const msg=encodeURIComponent("Join me on ZakiChat and let's chat!");location.href="https://wa.me/?text="+msg});$("#add-contact").addEventListener("click",()=>{const phone=prompt("Enter the person's phone number");if(phone?.trim())toast("Search for "+phone.trim()+" in contacts to start a conversation.")});document.addEventListener("DOMContentLoaded",init)})();
</script></body></html>
