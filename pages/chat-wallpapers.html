<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071525"><title>Chat Wallpaper Studio · ZakiChat</title>
<link rel="icon" href="../static/images/icon.jpg" type="image/jpeg"><link rel="stylesheet" href="../static/css/main.css"><link rel="stylesheet" href="../static/css/telegram-chat.css"><link rel="stylesheet" href="../static/css/signature-theme.css"><link rel="stylesheet" href="../static/css/chat-wallpapers.css"></head>
<body class="tg-app tg-wallpaper-page"><main class="wallpaper-shell">
<header class="wallpaper-header"><a id="wallpaper-back" href="chats.html" aria-label="Back">‹</a><div><span class="wallpaper-eyebrow">MAKE IT YOURS</span><h1>Chat wallpapers</h1><p>Choose a background for this conversation.</p></div></header>
<section class="wallpaper-preview" id="wallpaper-preview"><div class="preview-message incoming">Hey! How's your day going?</div><div class="preview-message outgoing">Much better now 😊</div><div class="preview-message incoming">This wallpaper looks beautiful ✨</div></section>
<section class="wallpaper-library"><div class="wallpaper-library-head"><div><h2>Wallpaper collection</h2><p>Choose a style. It is saved only for this chat.</p></div><span>12 DESIGNS</span></div>
<div class="wallpaper-grid" id="wallpaper-grid">
<button class="wallpaper-card wp-ocean" data-wallpaper="ocean"><span>Ocean Glass</span></button><button class="wallpaper-card wp-midnight" data-wallpaper="midnight"><span>Midnight Blue</span></button><button class="wallpaper-card wp-aurora" data-wallpaper="aurora"><span>Aurora</span></button><button class="wallpaper-card wp-rose" data-wallpaper="rose"><span>Rose Quartz</span></button><button class="wallpaper-card wp-emerald" data-wallpaper="emerald"><span>Emerald Dream</span></button><button class="wallpaper-card wp-sunset" data-wallpaper="sunset"><span>Sunset Glow</span></button><button class="wallpaper-card wp-crystal" data-wallpaper="crystal"><span>Crystal Glass</span></button><button class="wallpaper-card wp-carbon" data-wallpaper="carbon"><span>Carbon Texture</span></button><button class="wallpaper-card wp-lavender" data-wallpaper="lavender"><span>Lavender Mist</span></button><button class="wallpaper-card wp-forest" data-wallpaper="forest"><span>Forest Night</span></button><button class="wallpaper-card wp-coral" data-wallpaper="coral"><span>Coral Reef</span></button><button class="wallpaper-card wp-sky" data-wallpaper="sky"><span>Skyline</span></button>
</div>
<label class="wallpaper-upload">＋ Choose photo from this phone<input id="wallpaper-local-file" type="file" accept="image/*" hidden></label>
<div class="wallpaper-actions"><button type="button" id="wallpaper-reset">Reset to default</button><button type="button" id="wallpaper-apply" disabled>Apply wallpaper</button></div><p id="wallpaper-status" role="status" aria-live="polite"></p>
</section></main><script src="../static/js/chat-wallpapers.js"></script></body></html>
