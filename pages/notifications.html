<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Notification Center | Molan Chat</title>

  <link rel="stylesheet" href="../static/css/main.css">

  <link rel="stylesheet" href="../static/css/responsive.css">
  <link rel="stylesheet" href="../static/css/notifications.css">
  <link rel="stylesheet" href="../static/css/signature-theme.css">
</head>

<body class="notifications-page">

  <main class="notifications-shell">

    <header class="notifications-header">

      <div class="notifications-heading">

        <a
          href="settings.html"
          class="notifications-back"
          aria-label="Back to Settings"
        >
          ← Settings
        </a>

        <span class="notifications-eyebrow">
          ZAMIVOX • NOTIFICATIONS
        </span>

        <h1>Notification Center</h1>

        <p>
          View and manage your Molan Chat notifications.
        </p>

      </div>

      <button
        id="markAllReadButton"
        class="notifications-action"
        type="button"
      >
        <span aria-hidden="true">✓</span>
        <span>Mark all as read</span>
      </button>

    </header>

    <section
      id="notificationsList"
      class="notifications-list"
      aria-live="polite"
      aria-label="Notifications"
    ></section>

    <div
      id="notificationsEmpty"
      class="notifications-empty"
      hidden
    >
      <div
        class="notifications-empty-icon"
        aria-hidden="true"
      >
        🔔
      </div>

      <h2>You're all caught up</h2>

      <p>
        New Molan Chat notifications will appear here.
      </p>
    </div>

    <div
      id="notificationsError"
      class="notifications-error"
      role="alert"
      hidden
    ></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
  <script src="../static/js/supabase-client.js"></script>
<script src="../static/js/appearance.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/realtime.js"></script>
  <script src="../static/js/notification-badge.js"></script>
  <script src="../static/js/notifications.js"></script>

</html>
