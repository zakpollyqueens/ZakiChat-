<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Updates | ZakiChat</title>

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/chat.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
  <link rel="stylesheet" href="../static/css/notifications.css">
</head>

<body class="notifications-page">

  <main class="notifications-shell">

    <header class="notifications-header">
      <div class="notifications-heading">
        <span class="notifications-eyebrow">ZAKICHAT</span>

        <h1>Updates</h1>

        <p>
          Your latest notifications and message activity.
        </p>
      </div>

      <button
        id="markAllReadButton"
        class="notifications-action"
        type="button"
      >
        <span aria-hidden="true">✓</span>
        Mark all as read
      </button>
    </header>

    <section
      id="notificationsList"
      class="notifications-list"
      aria-live="polite"
      aria-label="Notifications"
    ></section>

    <div
      id="notificationsEmpty"
      class="notifications-empty"
      hidden
    >
      <div
        class="notifications-empty-icon"
        aria-hidden="true"
      >
        🔔
      </div>

      <h2>You're all caught up</h2>

      <p>
        New notifications will appear here.
      </p>
    </div>

    <div
      id="notificationsError"
      class="notifications-error"
      role="alert"
      hidden
    ></div>

  </main>

  <!-- Existing navigation intentionally preserved -->
  <nav
    class="bottom-nav"
    aria-label="Main app navigation"
  >
    <a href="chats.html">
      <span aria-hidden="true">💬</span>
      Chats
    </a>

    <a href="contacts.html">
      <span aria-hidden="true">👥</span>
      Contacts
    </a>

    <a href="groups.html">
      <span aria-hidden="true">👨‍👩‍👧</span>
      Groups
    </a>

    <a
      class="selected"
      href="notifications.html"
      aria-current="page"
    >
      <span aria-hidden="true">🔔</span>
      Updates
    </a>

    <a href="settings.html">
      <span aria-hidden="true">⚙️</span>
      Settings
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/realtime.js"></script>
  <script src="../static/js/notification-badge.js"></script>
  <script src="../static/js/notifications.js"></script>

</body>
</html>
