<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled | ZakiChat</title>
  <link rel="stylesheet" href="../static/css/auth.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg, #f5f7fa);
      color: var(--text, #17202a);
    }

    .payment-card {
      width: min(100%, 460px);
      padding: 32px 24px;
      text-align: center;
      border-radius: 24px;
      background: var(--card, #ffffff);
      box-shadow: 0 16px 50px rgba(0, 0, 0, .10);
    }

    .payment-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 2rem;
      background: rgba(245, 166, 35, .14);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.7rem;
    }

    p {
      margin: 0 auto 24px;
      line-height: 1.6;
      opacity: .78;
    }

    .payment-button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      background: #27d3a2;
      color: #07140f;
    }
  </style>
</head>
<body>
  <main class="payment-card">
    <div class="payment-icon" aria-hidden="true">!</div>

    <h1>Payment Cancelled</h1>

    <p>
      Your payment was cancelled or could not be completed.
      You can return to ZakiChat and try again.
    </p>

    <a class="payment-button" href="login.html">
      Return to ZakiChat
    </a>
  </main>
</body>
</html>
