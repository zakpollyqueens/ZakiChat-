<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updates | ZakiChat</title>

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
  <link rel="stylesheet" href="../static/css/status.css">
</head>

<body class="status-page">
  <main class="status-shell">

    <header class="status-header">
      <div>
        <span class="status-eyebrow">ZAKICHAT</span>
        <h1>Updates</h1>
        <p>Share a status with your contacts.</p>
      </div>
    </header>

    <section class="my-status-card">
      <div class="my-status-avatar" id="myStatusAvatar">+</div>

      <div class="my-status-info">
        <strong>My Status</strong>
        <span id="myStatusSummary">Add a status update</span>
      </div>

      <button
        id="addStatusButton"
        class="status-add-button"
        type="button"
        aria-label="Add status"
      >
        +
      </button>
    </section>

    <section class="status-section">
      <div class="status-section-heading">
        <h2>Recent updates</h2>
        <span id="statusCount">0</span>
      </div>

      <div id="statusList" class="status-list" aria-live="polite"></div>

      <div id="statusEmpty" class="status-empty">
        <div class="status-empty-icon">◌</div>
        <h3>No recent updates</h3>
        <p>Status updates from your contacts will appear here.</p>
      </div>

      <div id="statusError" class="status-error" hidden></div>
    </section>

  </main>

  <!-- Create status dialog -->
  <div id="statusComposer" class="status-dialog" hidden>
    <div class="status-dialog-card">
      <div class="status-dialog-header">
        <div>
          <span class="status-eyebrow">NEW UPDATE</span>
          <h2>Create status</h2>
        </div>

        <button
          id="closeComposerButton"
          class="status-close-button"
          type="button"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <textarea
        id="statusText"
        maxlength="700"
        rows="6"
        placeholder="What's on your mind?"
      ></textarea>

      <div class="status-character-count">
        <span id="statusCharacterCount">0</span>/700
      </div>

      <label class="status-media-picker">
        <span>📷 Add photo or video</span>
        <input
          id="statusMedia"
          type="file"
          accept="image/*,video/*"
        >
      </label>

      <div id="statusMediaPreview" class="status-media-preview" hidden></div>

      <button id="publishStatusButton" class="status-primary-button" type="button">
        Post status
      </button>

      <p id="composerError" class="status-form-error" hidden></p>
    </div>
  </div>

  <!-- Status viewer dialog -->
  <div id="statusViewer" class="status-dialog" hidden>
    <div class="status-viewer-card">
      <div class="status-viewer-header">
        <div>
          <strong id="viewerName">Status</strong>
          <span id="viewerTime"></span>
        </div>

        <button
          id="closeViewerButton"
          class="status-close-button"
          type="button"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <div id="viewerContent" class="status-viewer-content"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Main app navigation">
    <a href="chats.html"><span>💬</span>Chats</a>
    <a href="contacts.html"><span>👥</span>Contacts</a>
    <a href="groups.html"><span>👨‍👩‍👧</span>Groups</a>
    <a class="selected" href="status.html" aria-current="page">
      <span>🔔</span>Updates
    </a>
    <a href="settings.html"><span>⚙️</span>Settings</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>
  <script src="../static/js/account-manager.js"></script>
  <script src="../static/js/supabase-client.js"></script>
  <script src="../static/js/auth-guard.js"></script>
  <script src="../static/js/realtime.js"></script>
  <script src="../static/js/status.js"></script>
</body>
</html>
