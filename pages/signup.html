<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Create your ZakiChat account.">
<title>Create Account | ZakiChat</title>
<link rel="icon" href="../static/images/icon.jpg" type="image/jpeg">
<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/auth.css">
</head>
<body class="auth-page">

<main class="auth-shell">

  <a href="../index.html" class="auth-brand">
    <img src="../static/images/icon.jpg" alt="ZakiChat logo">
    <span>Zaki<span>Chat</span></span>
  </a>

  <section class="auth-card">

    <div class="auth-heading">
      <span class="section-label">JOIN ZAKICHAT</span>
      <h1>Create your account</h1>
      <p>Start connecting with people, groups and communities.</p>
    </div>

    <form id="signupForm" class="auth-form">

      <label for="displayName">Display name</label>
      <input
        id="displayName"
        name="displayName"
        type="text"
        autocomplete="name"
        placeholder="Your name"
        maxlength="80"
        required
      >

      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <div class="password-field">
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="Create a password"
          minlength="8"
          required
        >
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
      </div>

      <label for="confirmPassword">Confirm password</label>
      <div class="password-field">
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Repeat your password"
          minlength="8"
          required
        >
        <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password">Show</button>
      </div>

      <label class="terms-check">
        <input type="checkbox" id="terms" required>
        <span>I agree to the ZakiChat terms and privacy rules.</span>
      </label>

      <button type="submit" class="button button-primary auth-submit">
        Create Account
      </button>

      <p id="signupMessage" class="auth-message" role="status"></p>
    </form>

    <div class="auth-divider">
      <span>OR</span>
    </div>

    <p class="auth-switch">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>

  </section>

  <p class="auth-footer">
    © 2026 ZakiChat · A Zakmolanitech Solutions project
  </p>

</main>

<script src="../static/js/auth.js"></script>
</body>
</html>
