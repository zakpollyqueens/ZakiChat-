<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426"><title>Explore the web · ZakiChat</title>
<link rel="stylesheet" href="../static/css/main.css"><link rel="stylesheet" href="../static/css/telegram-chat.css"><link rel="stylesheet" href="../static/css/signature-theme.css">
<style>
body.zc-web-search{overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior-y:contain;--s-bg:#071426;--s-panel:#0d2037;--s-line:rgba(111,203,232,.15);--s-text:#e8f8ff;--s-muted:#91aabe;background:var(--s-bg)!important;color:var(--s-text)!important}
.zws-shell{display:flex;flex-direction:column;min-height:100dvh;height:auto;max-width:760px;margin:auto;padding-bottom:calc(78px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0%,rgba(0,185,239,.13),transparent 40%),var(--s-bg)}
.zws-header{padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--s-line);background:linear-gradient(150deg,#0b2038,#071426)}
.zws-top{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.zws-back{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--s-line);border-radius:13px;background:#102b45;color:#c8f4ff;font-size:23px}
.zws-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.zws-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #9cecff;border-radius:11px;background:linear-gradient(145deg,#9bf3ff,#159ed3 48%,#071d49);box-shadow:inset 0 1px 2px #fff9,0 4px 13px #00b9ef33;color:#f6fdff;font-size:10px;font-weight:900}
.zws-label{margin-left:auto;color:var(--s-muted);font-size:11px}
.zws-form{display:flex;gap:8px;padding:5px;border:1px solid rgba(69,221,255,.28);border-radius:16px;background:#071a2c}
.zws-form input{flex:1;min-width:0;padding:0 10px;border:0!important;outline:0;background:transparent!important;color:var(--s-text)!important;font-size:14px}
.zws-form button{min-width:74px;padding:0 13px;border:0;border-radius:11px;background:linear-gradient(120deg,#45ddff,#148fd6);color:#031728;font-weight:800}
.zws-filters{display:flex;gap:8px;overflow:auto;padding-top:12px;scrollbar-width:none}
.zws-filters button{flex:none;padding:8px 13px;border:1px solid var(--s-line);border-radius:20px;background:#0c2239;color:#aac5d9;font-size:12px;font-weight:650}
.zws-filters button.is-active{border-color:#45ddff55;background:#123b55;color:#aaf2ff}
.zws-content{flex:1;padding:13px 14px 22px}
.zws-status{padding:20px 10px;text-align:center;color:var(--s-muted);font-size:13px;line-height:1.6}
.zws-results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px;color:var(--s-muted);font-size:12px}
.zws-safe{display:inline-flex;align-items:center;gap:5px;color:#7ce8bf;font-size:11px}
.zws-result{display:block;margin-bottom:10px;padding:15px;border:1px solid var(--s-line);border-radius:17px;background:linear-gradient(145deg,rgba(15,39,61,.97),rgba(7,23,40,.98));text-decoration:none;overflow-wrap:anywhere}
.zws-result:active{border-color:#45ddff66;background:#102c45}
.zws-domain{display:block;margin-bottom:7px;color:#78a6c2;font-size:11px}
.zws-result strong{display:block;margin-bottom:7px;color:#a9eaff;font-size:15px;line-height:1.4}
.zws-result p{margin:0;color:#b1c5d5;font-size:13px;line-height:1.55}
.zws-empty-icon{display:grid;place-items:center;width:62px;height:62px;margin:28px auto 14px;border:1px solid #45ddff30;border-radius:20px;background:linear-gradient(145deg,#123c58,#101c3a);color:#7ceaff;font-size:28px}
.zws-empty-title{margin:0;text-align:center;color:var(--s-text);font-size:18px}
.zws-empty-copy{max-width:300px;margin:8px auto;text-align:center;color:var(--s-muted);font-size:13px;line-height:1.6}
.zws-bottom{position:fixed;z-index:10;left:12px;right:12px;bottom:calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:5px;border:1px solid rgba(111,203,232,.13);border-radius:28px;background:rgba(8,26,44,.95);box-shadow:0 7px 25px #0006;backdrop-filter:blur(18px)}
.zws-bottom a{display:flex;min-height:48px;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:22px;color:#9bb7cc;font-size:11px;text-decoration:none}
.zws-bottom svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zws-bottom a.is-current{background:#123b55;color:#69e7ff}
@media(min-width:600px){.zws-bottom{left:calc(50% - 218px);right:auto;width:436px}}

/* Refined mobile-first search experience */
.zws-shell{max-width:720px;min-height:100dvh;height:auto;background:radial-gradient(ellipse at 50% -10%,rgba(0,191,242,.19),transparent 46%),#071426}
.zws-header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 16px 15px;border-bottom:1px solid rgba(111,203,232,.12);background:rgba(7,20,38,.93);backdrop-filter:blur(22px)}
.zws-top{gap:11px;margin-bottom:17px}
.zws-back{width:40px;height:40px;border:1px solid rgba(91,218,255,.2);border-radius:14px;background:linear-gradient(145deg,#153b58,#0b1e35);color:#a8eeff;box-shadow:inset 0 1px 0 #ffffff0c}
.zws-brand{gap:11px;font-size:18px;letter-spacing:-.45px}
.zws-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#d7fbff 0%,#36d7f8 28%,#087eb8 58%,#081e4c 100%);box-shadow:inset 0 1px 2px #fff9,0 0 0 1px #5fe7ff55,0 5px 17px #00b9ef30;color:#fff;font-size:10px}
.zws-label{font-size:10px;letter-spacing:.8px;text-transform:uppercase}
.zws-form{min-height:54px;align-items:center;gap:10px;padding:5px 6px 5px 16px;border:1px solid rgba(80,218,255,.33);border-radius:19px;background:linear-gradient(120deg,#102c45,#081a2d);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 25px rgba(0,0,0,.16)}
.zws-form:focus-within{border-color:#45ddff99;box-shadow:0 0 0 3px #45ddff12,0 8px 25px #0002}
.zws-form input{height:44px;padding:0 2px!important;font-size:14px!important;letter-spacing:.1px}
.zws-form input::placeholder{color:#8ba9bd;opacity:1}
.zws-form button{min-width:83px;height:43px;border-radius:14px;background:linear-gradient(135deg,#65e8ff,#16b8e6 55%,#138fd4);box-shadow:inset 0 1px 0 #ffffff7a,0 3px 9px #00b9ef20;color:#041629;font-size:13px}
.zws-filters{gap:8px;padding-top:14px}
.zws-filters button{padding:9px 14px;border-color:rgba(111,203,232,.14);background:#0b1e33;color:#a3bed0;font-size:12px;transition:background .18s,border-color .18s}
.zws-filters button.is-active{border-color:#45ddff66;background:linear-gradient(135deg,#16425d,#10304a);color:#a9f1ff;box-shadow:inset 0 1px 0 #ffffff0a}
.zws-type-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:15px}
.zws-type-tabs button{padding:10px 7px;border-radius:14px;text-align:center}
.zws-special-filters{display:flex;gap:8px;overflow:auto;padding-top:9px;scrollbar-width:none}
.zws-special-filters button{flex:none;padding:7px 11px;border:1px solid rgba(111,203,232,.11);border-radius:18px;background:#081a2d;color:#8eacbf;font-size:11px}
.zws-special-filters button.is-active{border-color:#45ddff55;background:#123b55;color:#aaf2ff}
.zws-media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.zws-media-card{min-width:0;overflow:hidden;border:1px solid rgba(111,203,232,.14);border-radius:16px;background:#0b2035;color:#e8f8ff;text-decoration:none}
.zws-media-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#102b45}
.zws-media-copy{padding:10px}
.zws-media-copy strong{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;line-height:1.4;color:#a9eaff}
.zws-media-copy small{display:block;margin-top:6px;color:#8eacbf;font-size:10px;overflow-wrap:anywhere}
.zws-document-icon{display:grid;place-items:center;height:96px;background:linear-gradient(145deg,#123c58,#101c3a);font-size:34px;color:#8ceaff}
.zws-result-actions{display:flex;gap:8px;margin-top:12px}
.zws-result-actions a{padding:7px 10px;border:1px solid #45ddff33;border-radius:10px;color:#9feaff;font-size:11px;text-decoration:none}
.zws-result-actions a:first-child{background:#123b55}
@media(max-width:350px){.zws-type-tabs{gap:4px}.zws-type-tabs button{font-size:11px;padding:9px 3px}}
.zws-content{padding:17px 14px calc(110px + env(safe-area-inset-bottom));min-height:0;overflow:visible}
.zws-results-head{margin:2px 3px 14px;font-size:12px}
.zws-result{margin-bottom:11px;padding:16px;border-color:rgba(111,203,232,.13);border-radius:18px;background:linear-gradient(145deg,rgba(15,39,61,.98),rgba(8,24,42,.99));box-shadow:0 5px 16px rgba(0,0,0,.08);transition:transform .16s,border-color .16s}
.zws-result:active{transform:scale(.99);border-color:#45ddff77;background:#102c45}
.zws-domain{display:flex;align-items:center;gap:6px;margin-bottom:8px;color:#7eabc5;font-size:11px}
.zws-result strong{font-size:15px;line-height:1.45;color:#8de5ff}
.zws-result p{font-size:13px;line-height:1.62;color:#b5c8d8}
.zws-empty-icon{width:68px;height:68px;margin:34px auto 16px;border-color:#45ddff35;border-radius:22px;background:linear-gradient(145deg,#16445e,#0d2441);box-shadow:inset 0 1px 0 #ffffff0c,0 9px 25px #0002;color:#8ceaff;font-size:31px}
.zws-empty-title{font-size:19px;letter-spacing:-.3px}
.zws-empty-copy{max-width:310px;margin:9px auto;color:#91aabe;font-size:13px;line-height:1.7}
.zws-bottom{border-color:rgba(111,203,232,.17);background:rgba(8,26,44,.91);box-shadow:0 10px 32px #0006,inset 0 1px 0 #ffffff0a}
.zws-bottom a.is-current{background:linear-gradient(135deg,#17415b,#10304b);color:#6de7ff}
@media(max-width:380px){.zws-label{display:none}.zws-form{padding-left:12px}.zws-form button{min-width:72px}}
@media(prefers-reduced-motion:reduce){.zws-result,.zws-filters button{transition:none}}
/* Allow the full results list to scroll on phones and restore the original ZakiChat icon. */
.zws-mark-img{display:block;width:42px;height:42px;flex:none;object-fit:cover;border:1px solid #72eaff66;border-radius:13px;box-shadow:0 5px 18px #00b9ef25}
.zws-media-card{display:flex;flex-direction:column;align-self:start;min-height:0;transition:transform .2s,border-color .2s,box-shadow .2s}
.zws-media-card:active{transform:scale(.985);border-color:#45ddff88;box-shadow:0 8px 24px #0003}
.zws-media-card img{flex:none;aspect-ratio:4/3;min-height:120px;object-fit:cover}
.zws-media-fallback{display:grid;place-items:center;min-height:120px;aspect-ratio:4/3;background:radial-gradient(circle at 30% 20%,#1d5875,#10233d 72%);color:#80e8ff;font-size:30px}
@media(max-width:360px){.zws-media-grid{gap:8px}.zws-media-copy{padding:9px}.zws-media-card img,.zws-media-fallback{min-height:100px}}

</style>
</head>
<body class="tg-app zc-web-search">
<main class="zws-shell">
<header class="zws-header">
 <div class="zws-top"><a class="zws-back" href="chats.html" aria-label="Back to chats">‹</a><div class="zws-brand"><img class="zws-mark-img" src="../static/images/icon.jpg" alt="ZakiChat" loading="eager"><span>Explore the web</span></div><span class="zws-label">ZakiChat</span></div>
 <form class="zws-form" id="web-search-form"><input id="web-search-input" type="search" placeholder="Search anything on the web…" autocomplete="off" enterkeyhint="search" maxlength="160"><button type="submit">Search</button></form>
 <div class="zws-filters zws-type-tabs" role="tablist" aria-label="Search category"><button type="button" class="is-active" data-scope="web" role="tab" aria-selected="true">All</button><button type="button" data-scope="images" role="tab" aria-selected="false">Images</button><button type="button" data-scope="videos" role="tab" aria-selected="false">Videos</button><button type="button" data-scope="documents" role="tab" aria-selected="false">Documents</button></div><div class="zws-special-filters" aria-label="Community search"><button type="button" data-scope="telegram">Telegram channels</button><button type="button" data-scope="whatsapp">WhatsApp groups</button></div>
</header>
